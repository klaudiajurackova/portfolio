<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klaudia — Games UX Designer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
/* ──────────────────────────────────────────────────────────
   Klaudia portfolio — editorial light
   Type: Instrument Serif (display) + Geist (body) + JetBrains Mono (meta)
   ────────────────────────────────────────────────────────── */

:root {
  --paper: #F4EFE6;
  --paper-soft: #EDE6DA;
  --paper-deep: #E4DBCB;
  --ink: #1A1814;
  --ink-soft: #4A463E;
  --ink-mute: #7A746A;
  --ink-faint: #B8B0A2;
  --rule: rgba(26, 24, 20, 0.14);
  --rule-soft: rgba(26, 24, 20, 0.07);
  --accent: #B5462C;

  --serif: "Instrument Serif", "Times New Roman", serif;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --gutter: 32px;
  --col: 96px;

  --t-display: clamp(56px, 11vw, 200px);
  --t-h1: clamp(40px, 5.6vw, 92px);
  --t-h2: clamp(28px, 3.4vw, 56px);
  --t-h3: clamp(20px, 1.7vw, 28px);
  --t-body: 17px;
  --t-meta: 12px;
}

@media (max-width: 700px) {
  :root {
    --gutter: 18px;
    --t-display: clamp(60px, 15vw, 80px);
    --t-h1: clamp(48px, 12vw, 68px);
    --t-h2: clamp(38px, 9vw, 52px);
    --t-h3: clamp(26px, 6vw, 36px);
  }
}

* { box-sizing: border-box; }

html, body {
  scroll-behavior: smooth;
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--t-body);
  line-height: 1.5;
  font-weight: 400;
  font-feature-settings: "ss01", "ss02";
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

body {
  background-image:
    radial-gradient(rgba(26,24,20,0.025) 1px, transparent 1px),
    radial-gradient(rgba(26,24,20,0.018) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 1px 2px;
}

::selection { background: var(--accent); color: var(--paper); }

a { color: inherit; text-decoration: none; }

/* ── Typography utilities ─────────────────────────────── */

.serif { font-family: var(--serif); font-weight: 400; }
.serif-i { font-family: var(--serif); font-weight: 400; font-style: italic; }
.mono { font-family: var(--mono); font-weight: 400; font-feature-settings: "ss01"; }

.display {
  font-family: var(--serif);
  font-size: var(--t-display);
  line-height: 0.9;
  letter-spacing: -0.025em;
  font-weight: 400;
}
.display em {
  font-style: italic;
  letter-spacing: -0.015em;
}

.h1 {
  font-family: var(--serif);
  font-size: var(--t-h1);
  line-height: 0.98;
  letter-spacing: -0.02em;
  font-weight: 400;
}
.h2 {
  font-family: var(--serif);
  font-size: var(--t-h2);
  line-height: 1.02;
  letter-spacing: -0.018em;
  font-weight: 400;
}
.h3 {
  font-family: var(--sans);
  font-size: var(--t-h3);
  line-height: 1.25;
  letter-spacing: -0.01em;
  font-weight: 500;
}

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 400;
}

.lede {
  font-family: var(--sans);
  font-size: clamp(19px, 1.55vw, 24px);
  line-height: 1.45;
  color: var(--ink-soft);
  font-weight: 400;
  letter-spacing: -0.005em;
  text-wrap: pretty;
  max-width: 36ch;
}

.body-lg {
  font-size: 18px;
  line-height: 1.55;
  color: var(--ink-soft);
  text-wrap: pretty;
}

/* ── Layout ───────────────────────────────────────────── */

.shell {
  width: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: 0 32px;
}
.nav .shell,
.hero .shell,
.contact.shell,
section:has(#quotes) .shell {
  max-width: 1200px;
}
section:has(#work) .section-head {
  margin-left: calc(-1 * clamp(0px, (100vw - 880px) / 2, 160px));
}
@media (max-width: 1100px) {
  .shell { padding: 0 32px; }
}
@media (max-width: 700px) {
  .shell { padding: 0 24px; }
}

.section {
  padding: clamp(56px, 9vw, 96px) 0;
  position: relative;
}
.section--dense { padding: clamp(40px, 6vw, 64px) 0; }
.section--hero { padding: clamp(64px, 10vw, 120px) 0 clamp(40px, 5vw, 64px); }

[data-density="airy"] .section { padding: clamp(72px, 12vw, 128px) 0; }
[data-density="dense"] .section { padding: clamp(40px, 6vw, 64px) 0; }

.rule {
  height: 1px;
  background: var(--rule);
  border: 0;
  margin: 0;
}

/* ── Nav ──────────────────────────────────────────────── */

.nav {
  position: sticky;
  top: 0;
  z-index: 110;
  background: color-mix(in oklab, var(--paper) 85%, transparent);
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  border-bottom: 1px solid var(--rule-soft);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.nav-mark {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  letter-spacing: -0.01em;
}
.nav-mark sup {
  font-family: var(--mono);
  font-style: normal;
  font-size: 9px;
  letter-spacing: 0.12em;
  vertical-align: super;
  margin-left: 4px;
  color: var(--ink-mute);
}
.nav-links {
  display: flex;
  gap: 28px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.nav-links a { position: relative; padding: 6px 0; }
.nav-links a:hover { color: var(--ink); }
.nav-cta {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--paper);
  background: var(--ink);
  padding: 9px 14px;
  border-radius: 999px;
  white-space: nowrap;
  transition: transform 0.18s ease, background 0.18s ease;
}
.nav-cta:hover { background: var(--accent); }

/* ── Hamburger button ─────────────────────────────────── */
.nav-burger {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 0;
  width: 40px;
  height: 40px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  position: relative;
  z-index: 110;
}
.nav-burger-bar {
  display: block;
  width: 22px;
  height: 1.5px;
  background: var(--ink);
  border-radius: 2px;
  transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1),
              opacity 0.2s ease,
              top 0.35s cubic-bezier(0.23, 1, 0.32, 1);
  position: absolute;
}
.nav-burger-bar:nth-child(1) { top: calc(50% - 7px); }
.nav-burger-bar:nth-child(2) { top: calc(50% - 0.75px); }
.nav-burger-bar:nth-child(3) { top: calc(50% + 5.5px); }

.nav-burger[aria-expanded="true"] .nav-burger-bar:nth-child(1) {
  top: calc(50% - 0.75px);
  transform: rotate(45deg);
}
.nav-burger[aria-expanded="true"] .nav-burger-bar:nth-child(2) {
  opacity: 0;
  transform: scaleX(0);
}
.nav-burger[aria-expanded="true"] .nav-burger-bar:nth-child(3) {
  top: calc(50% - 0.75px);
  transform: rotate(-45deg);
}

/* ── Mobile overlay menu ──────────────────────────────── */
.nav-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: flex-start;
  padding: 80px clamp(32px, 8vw, 64px) clamp(32px, 6vw, 48px);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  transition: opacity 0.3s ease,
              transform 0.35s cubic-bezier(0.23, 1, 0.32, 1),
              visibility 0s linear 0.35s;
}
.nav-overlay.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  transition: opacity 0.3s ease,
              transform 0.35s cubic-bezier(0.23, 1, 0.32, 1),
              visibility 0s linear 0s;
}
.nav-overlay-links {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.nav-overlay-links a {
  font-family: var(--mono);
  font-style: normal;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1;
  color: var(--ink-soft);
  text-decoration: none;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), color 0.15s ease;
}
.nav-overlay.open .nav-overlay-links a:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 0.05s; }
.nav-overlay.open .nav-overlay-links a:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
.nav-overlay.open .nav-overlay-links a:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 0.15s; }
.nav-overlay-links a:hover { color: var(--ink); }

@media (max-width: 768px) {
  .nav-links { display: none; }
  .nav-burger { display: flex; }
}

/* ── Hero ─────────────────────────────────────────────── */

.hero {
  padding: clamp(40px, 6vw, 64px) 0 0;
}
.hero-meta {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
  align-items: start;
  margin-bottom: clamp(72px, 10vw, 128px);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.hero-meta > div { grid-column: span 3; }
.hero-meta b { display: block; color: var(--ink); font-weight: 500; margin-top: 6px; letter-spacing: 0.04em; line-height: 1.35; text-wrap: balance; }

.hero-statement {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
  align-items: end;
}
.hero-statement .text { grid-column: 1 / span 9; }
.hero-statement .meta { grid-column: 10 / span 3; padding-bottom: 10px; }
.hero-statement--solo .text { grid-column: 1 / -1; }

.hero-statement h1 {
  margin: 0;
}

.hero-statement-sub {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(22px, 2vw, 30px);
  line-height: 1.3;
  letter-spacing: -0.008em;
  color: var(--ink-soft);
  margin: 16px 0 0;
  max-width: 36ch;
  text-wrap: pretty;
}

.hero-statement-cta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: clamp(28px, 3vw, 40px);
}

@media (max-width: 700px) {
  .hero-meta { display: none; }
  .hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-top: clamp(48px, 10vw, 72px);
    padding-bottom: 72px;
    min-height: calc(100vh - 64px);
    min-height: calc(var(--inner-vh, 100svh) - 64px);
    position: relative;
  }
  .hero-marquee { display: none !important; }
}

.hero-scroll-cue { display: none; }
@keyframes scrollCueBob {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%       { transform: translateX(-50%) translateY(6px); }
}
@media (max-width: 700px) {
  .hero-scroll-cue {
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--ink-mute);
    animation: scrollCueBob 2s ease-in-out infinite;
    transition: opacity 0.35s ease;
  }
  .hero-scroll-cue.is-gone {
    opacity: 0;
    pointer-events: none;
  }
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-radius: 999px;
  text-decoration: none;
  border: 1px solid transparent;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  white-space: nowrap;
}
.btn--primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.btn--primary:hover {
  background: var(--accent);
  border-color: var(--accent);
  transform: translateY(-1px);
}
.btn--primary span { transition: transform 0.2s ease; }
.btn--primary:hover span { transform: translateX(3px); }
.btn--ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--rule);
}
.btn--ghost:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(181, 70, 44, 0.06);
  transform: translateY(-1px);
}

.hero-name {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-name .small {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

.hero-marquee {
  display: flex;
  gap: 56px;
  align-items: center;
  margin-top: clamp(72px, 9vw, 112px);
  padding: 18px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  overflow: hidden;
  white-space: nowrap;
  position: relative;
  left: 50%;
  width: 100vw;
  transform: translateX(-50%);
}
.hero-marquee .track {
  display: flex;
  gap: 56px;
  animation: marquee 40s linear infinite;
}
.hero-marquee .dot {
  width: 5px; height: 5px;
  background: var(--accent);
  border-radius: 50%;
  display: inline-block;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

@media (max-width: 900px) {
  .hero-meta > div { grid-column: span 6; }
  .hero-statement .text,
  .hero-statement .meta { grid-column: 1 / -1; }
}

/* ── Section header ───────────────────────────────────── */

.section-head {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-bottom: 0;
  margin-bottom: clamp(40px, 5vw, 64px);
}
.section-head .title h2 {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  font-style: normal;
  line-height: 1;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0;
}
.section-head .title h2 em {
  font-style: normal;
}

/* ── Work / Project cards ─────────────────────────────── */

.work-cards {
  display: flex;
  flex-direction: column;
  gap: clamp(72px, 10vw, 140px);
}

.pc-card {
  display: block;
  color: inherit;
  text-decoration: none;
}

.pc-head {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: clamp(24px, 3vw, 36px);
  max-width: 60ch;
}
.pc-eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.pc-title {
  font-family: var(--serif);
  font-size: clamp(32px, 4.4vw, 64px);
  line-height: 1;
  letter-spacing: -0.022em;
  font-weight: 400;
  margin: 0;
  color: var(--ink);
  text-wrap: balance;
  transition: color 0.25s ease;
}
.pc-summary {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(19px, 1.7vw, 26px);
  line-height: 1.45;
  color: var(--ink-soft);
  margin: 0;
  max-width: 44ch;
  text-wrap: pretty;
}
.pc-aside {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 4px;
}
.pc-stat {
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
  white-space: nowrap;
}
.pc-stat-num {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(28px, 2.8vw, 40px);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--accent);
}
.pc-stat-lbl {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  white-space: nowrap;
}
.pc-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--paper-soft);
  border: 1px solid var(--rule);
  border-radius: 999px;
  white-space: nowrap;
}
.pc-pill::before {
  content: "";
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
}

.pc-video {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--paper-deep);
  border-radius: 4px;
  overflow: hidden;
  transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.pc-video--phone {
  aspect-ratio: unset;
  overflow: visible;
  background: transparent;
  display: flex;
  justify-content: center;
  padding: clamp(20px, 3vw, 36px) 0;
}
.pc-video--info {
  aspect-ratio: unset;
  background: transparent;
  overflow: visible;
  border-radius: 0;
}

/* ── Grip info banner ─────────────────────────────────── */
.grip-info-card {
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: 8px;
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  overflow: hidden;
}
.grip-info-left {
  padding: clamp(24px, 3vw, 40px);
  display: flex;
  flex-direction: column;
  gap: 18px;
  border-right: 1px solid var(--rule);
  background: var(--paper-soft);
}
.grip-info-stat {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(52px, 6vw, 80px);
  line-height: 1;
  letter-spacing: -0.025em;
  color: var(--ink);
}
.grip-info-sublabels {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  line-height: 1.7;
}
.grip-info-tags-wrap {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.grip-info-tags-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.grip-info-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.grip-info-tag {
  display: inline-flex;
  padding: 5px 12px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid var(--rule);
  border-radius: 4px;
  color: var(--ink-soft);
  background: transparent;
  white-space: nowrap;
}
.grip-info-right {
  padding: clamp(24px, 3vw, 40px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(20px, 2.5vw, 32px);
  align-content: start;
  background: var(--paper);
}
.grip-info-meta {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.grip-info-meta-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.grip-info-meta-val {
  font-family: var(--sans);
  font-size: 15px;
  color: var(--ink);
  line-height: 1.3;
}
.info-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--ink-faint);
  background: none;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
  transition: border-color 0.15s ease, color 0.15s ease;
  color: var(--ink-faint);
  vertical-align: middle;
  position: relative;
  top: -1px;
  margin-left: 5px;
  -webkit-tap-highlight-color: transparent;
}
.info-btn::before {
  content: '';
  position: absolute;
  inset: -12px;
}
.info-btn:hover {
  border-color: var(--ink);
  color: var(--ink);
}
.info-btn svg { display: block; }
.info-tooltip {
  position: fixed;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  padding: 6px 10px;
  border-radius: 4px;
  pointer-events: none;
  z-index: 9999;
  transform: translateX(-50%) translateY(-4px);
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.info-tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--ink);
}
@media (max-width: 700px) {
  .grip-info-card { grid-template-columns: 1fr; }
  .grip-info-left { border-right: none; border-bottom: 1px solid var(--rule); }

  /* Heading scale — more dramatic jump over body text */
  .pc-title { font-size: clamp(48px, 12vw, 64px); line-height: 0.95; }
  .hero-statement h1 { font-size: clamp(60px, 15vw, 80px) !important; }
  .beyond-h { font-size: clamp(30px, 8vw, 42px); }
  .hero-statement-sub { font-size: clamp(20px, 5vw, 26px); }

  /* Selected Work section — clear section anchor, not grouped with first card */
  .section-head {
    padding-bottom: 0;
    margin-bottom: 48px;
  }

  /* Eyebrow + title grouping — tight pair, separated from summary */
  .pc-head { gap: 6px; }
  .pc-summary { margin-top: 16px; font-size: 19px; }
  .pc-aside { margin-top: 16px; }
}

/* ── iPhone 15 landscape frame ────────────────────────── */
.iphone-wrap {
  width: min(680px, 100%);
}
.iphone-frame {
  position: relative;
  background: #1C1C1E;
  border-radius: 46px;
  padding: 10px 18px 10px 50px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.12),
    0 0 0 2.5px #3A3A3C,
    0 0 0 3.5px rgba(255,255,255,0.04),
    0 40px 100px rgba(0,0,0,0.5),
    0 12px 32px rgba(0,0,0,0.28);
}
.iphone-frame::before {
  content: '';
  position: absolute;
  top: -3px;
  right: 22%;
  height: 3px;
  width: 14%;
  background: linear-gradient(to top, #2A2A2C, #4C4C4E, #2A2A2C);
  border-radius: 2px 2px 0 0;
}
.iphone-frame::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: 20%;
  height: 3px;
  width: 9%;
  background: linear-gradient(to bottom, #2A2A2C, #4C4C4E, #2A2A2C);
  border-radius: 0 0 2px 2px;
  box-shadow: calc(100% + 8px) 0 0 0 #3A3A3C;
}
.iphone-island {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  width: 11px;
  height: 38px;
  background: #000;
  border-radius: 999px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.07);
}
.iphone-screen {
  overflow: hidden;
  border-radius: 32px;
  background: #000;
}
.iphone-screen video {
  width: 100%;
  height: auto;
  display: block;
}
.pc-video image-slot {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.pc-video-tag {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: rgba(26, 24, 20, 0.78);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-radius: 2px;
  pointer-events: none;
  white-space: nowrap;
  backdrop-filter: blur(2px);
}
.pc-video-tag::before {
  content: "";
  width: 5px; height: 5px;
  background: var(--accent);
  border-radius: 50%;
}
.pc-card:hover .pc-video {
  transform: translateY(-2px);
}
.pc-card:hover .pc-title {
  color: var(--accent);
}
.pc-title { transition: color 0.25s ease; }

@media (max-width: 800px) {
  .pc-head { gap: 12px; }
}

@media (max-width: 700px) {
  .pc-video--phone {
    padding: 12px 0;
  }
  .iphone-wrap {
    width: min(300px, 92%);
    margin: 0 auto;
  }
  .iphone-frame {
    border-radius: 20px;
    padding: 5px 8px 5px 22px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.12),
      0 0 0 1.5px #3A3A3C,
      0 0 0 2px rgba(255,255,255,0.04),
      0 8px 24px rgba(0,0,0,0.22),
      0 4px 10px rgba(0,0,0,0.18);
  }
  .iphone-island {
    left: 7px;
    width: 5px;
    height: 17px;
  }
  .iphone-screen {
    border-radius: 14px;
  }
}


/* ── About ────────────────────────────────────────────── */

.about {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
  align-items: start;
}
.about-photo { grid-column: 1 / span 4; }
.about-photo image-slot {
  width: 100%;
  aspect-ratio: 4 / 5;
  border-radius: 4px;
  display: block;
}
.about-photo .caption {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
}
.about-text { grid-column: 6 / span 7; }
.about-text p {
  font-family: var(--serif);
  font-size: clamp(22px, 1.85vw, 30px);
  line-height: 1.32;
  letter-spacing: -0.005em;
  color: var(--ink);
  margin: 0 0 22px;
  text-wrap: pretty;
}
.about-text p em { font-style: italic; color: var(--ink); }
.about-text p .accent { color: var(--accent); font-style: italic; }

.about-facts {
  margin-top: 56px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  border-top: 1px solid var(--rule);
  padding-top: 28px;
}
.about-facts .fact { display: flex; flex-direction: column; gap: 6px; }
.about-facts .fact .k {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-mute);
}
.about-facts .fact .v {
  font-family: var(--serif); font-size: 22px; line-height: 1.2; letter-spacing: -0.01em;
}
.about-facts .fact .v em { font-style: italic; }

/* ── Testimonials ─────────────────────────────────────── */

.quotes {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
}

/* ── Recommendations ──────────────────────────────────── */

.quote {
  grid-column: span 4;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 32px 0 24px;
  border-top: 1px solid var(--ink);
  background: transparent;
  border-left: none;
  border-right: none;
  border-bottom: none;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
  width: 100%;
  position: relative;
  transition: background 0.25s ease;
}
.quote:hover { background: color-mix(in oklab, var(--ink) 2.5%, transparent); }
.quote:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.quote .mark {
  font-family: var(--serif);
  font-style: italic;
  font-size: 64px;
  line-height: 0.6;
  color: var(--accent);
  height: 28px;
}
.quote .body {
  font-family: var(--serif);
  font-size: clamp(20px, 1.5vw, 26px);
  line-height: 1.32;
  letter-spacing: -0.005em;
  text-wrap: pretty;
  flex: 1;
}
.quote .body em { font-style: italic; }
.quote .who {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
}
.quote .who .nm {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
}
.quote .who .rl {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.quote .who .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--ink-faint);
}
.quote .who .meta .dot { color: var(--ink-faint); }
.quote .who .meta .rel { font-style: italic; font-family: var(--serif); font-size: 12.5px; letter-spacing: 0; text-transform: none; }
.quote .read-full {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}
.quote .read-full .arr { transition: transform 0.2s ease; }
.quote:hover .read-full .arr { transform: translateX(4px); }
@media (max-width: 1000px) {
  .quote { grid-column: 1 / -1; }
}
@media (max-width: 700px) {
  .quotes { row-gap: 48px; }
  .quote { gap: 10px; }
  .quote .mark { font-size: 48px; height: 22px; }
}

/* ── Testimonial modal (full review) ──────────────────── */
.qm-backdrop {
  position: fixed;
  inset: 0;
  background: color-mix(in oklab, #1a1612 70%, transparent);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(16px, 4vw, 48px);
  animation: qmFade 0.22s ease forwards;
}
@keyframes qmFade { from { opacity: 0; } to { opacity: 1; } }
.qm-dialog {
  background: var(--paper);
  border: 1px solid var(--ink);
  width: min(720px, 100%);
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.18);
  animation: qmRise 0.28s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
}
@keyframes qmRise {
  from { transform: translateY(12px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.qm-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 28px 28px 20px;
  border-bottom: 1px solid var(--rule);
}
.qm-who { min-width: 0; }
.qm-name {
  font-family: var(--serif);
  font-size: clamp(22px, 2.2vw, 28px);
  letter-spacing: -0.01em;
  margin: 0 0 4px;
  color: var(--ink);
}
.qm-role {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 0 0 8px;
}
.qm-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-mute);
}
.qm-meta .dot { font-style: normal; }
.qm-close {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 50%;
  font-size: 22px;
  line-height: 1;
  color: var(--ink-soft);
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
}
.qm-close:hover { border-color: var(--ink); color: var(--ink); background: var(--paper-soft); }
.qm-body {
  flex: 1;
  overflow: auto;
  padding: 24px 28px 28px;
  position: relative;
}
.qm-mark {
  position: absolute;
  top: -8px;
  left: 14px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 88px;
  line-height: 1;
  color: var(--accent);
  opacity: 0.18;
  pointer-events: none;
}
.qm-body p {
  font-family: var(--serif);
  font-size: clamp(17px, 1.35vw, 21px);
  line-height: 1.55;
  color: var(--ink);
  margin: 0 0 14px;
  text-wrap: pretty;
}
.qm-body p:last-child { margin-bottom: 0; }
.qm-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 28px;
  border-top: 1px solid var(--rule);
  background: var(--paper-soft);
}
.qm-count {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--ink-mute);
}
.qm-nav { display: flex; gap: 8px; }
.qm-nav button {
  background: transparent;
  border: 1px solid var(--rule);
  padding: 8px 14px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.qm-nav button:hover { border-color: var(--ink); background: var(--paper); }
.quote {
  grid-column: span 4;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 32px 0 0;
  border-top: 1px solid var(--ink);
}
.quote .mark {
  font-family: var(--serif);
  font-style: italic;
  font-size: 64px;
  line-height: 0.6;
  color: var(--accent);
  height: 28px;
}
.quote .body {
  font-family: var(--serif);
  font-size: clamp(20px, 1.5vw, 26px);
  line-height: 1.32;
  letter-spacing: -0.005em;
  text-wrap: pretty;
  flex: 1;
}
.quote .body em { font-style: italic; }
.quote .who {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
}
.quote .who .nm {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
}
.quote .who .rl {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.quote.placeholder .body { color: var(--ink-faint); }
.quote.placeholder .body::before {
  content: "[ ";
  color: var(--ink-faint);
}
.quote.placeholder .body::after {
  content: " ]";
  color: var(--ink-faint);
}
@media (max-width: 1000px) {
  .quote { grid-column: 1 / -1; }
}
@media (max-width: 700px) {
  .quotes { row-gap: 48px; }
  .quote { gap: 10px; }
  .quote .mark { font-size: 48px; height: 22px; }
}

/* ── Contact / Footer ─────────────────────────────────── */

.contact {
  padding-top: clamp(56px, 9vw, 96px);
  padding-bottom: clamp(40px, 5vw, 56px);
}
.contact-display {
  font-family: var(--serif);
  font-size: clamp(48px, 11vw, 160px);
  line-height: 0.92;
  letter-spacing: -0.025em;
  margin: 0 0 clamp(32px, 5vw, 48px);
}
.contact-display em { font-style: italic; }
.contact-display a {
  position: relative;
  text-decoration: none;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-size: 100% 1px;
  background-position: 0 100%;
  transition: color 0.25s ease;
}
.contact-display a:hover { color: var(--accent); }

.contact-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
  border-top: 1px solid var(--rule);
  padding-top: 32px;
}
.contact-grid > div { grid-column: span 3; }
@media (max-width: 760px) {
  .contact-grid > div { grid-column: span 6; }
}
@media (max-width: 500px) {
  .contact-grid > div { grid-column: 1 / -1; }
}
.contact-grid .k {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 8px;
}
.contact-grid .v {
  font-family: var(--sans);
  font-size: 15px;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.contact-grid .v a:hover { color: var(--accent); }
@media (max-width: 700px) {
  .contact-grid .v a[href^="mailto"] {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: rgba(181, 70, 44, 0.4);
  }
}

.colophon {
  margin-top: 64px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
@media (max-width: 900px) {
  .contact-grid > div { grid-column: span 6; }
}
@media (max-width: 600px) {
  .contact-grid > div { grid-column: 1 / -1; }
  .contact-grid { gap: 24px; }
  .colophon {
    flex-direction: column;
    gap: 6px;
    margin-top: 40px;
  }
}

/* ── Reveal animation ─────────────────────────────────── */

.reveal {
  opacity: 1;
  transform: none;
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  .hero-marquee .track { animation: none; }
}

/* ── Image-slot styling override ──────────────────────── */

image-slot {
  --is-bg: var(--paper-deep);
  --is-fg: var(--ink-mute);
  --is-border: var(--rule);
}

/* ── Line-mask reveal (hero h1) ────────────────────────── */

.reveal-lines .line {
  display: block;
  overflow: hidden;
  padding-bottom: 0.05em;
  margin-bottom: -0.05em;
}
.reveal-lines .line .inner {
  display: inline-block;
}

/* ── Beyond the work — two bands, side-by-side on desktop ─ */

.section--bleed { padding: 0; }

.beyond {
  display: grid;
  grid-template-columns: 1fr;
}
@media (min-width: 900px) {
  .beyond { grid-template-columns: 1fr 1fr; }
}

.beyond-band {
  width: 100%;
  padding: clamp(36px, 5vw, 64px) 0;
  position: relative;
  display: flex;
}
.beyond-band--dark {
  background: #14120F;
  color: #EDE8DE;
}
.beyond-band--light {
  background: var(--paper-soft);
  color: var(--ink);
}

.beyond-inner {
  max-width: min(780px, 100%);
  margin: 0 auto;
  padding: 0 clamp(24px, 5vw, 64px);
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 1.4vw, 18px);
  width: 100%;
}
@media (min-width: 900px) {
  .beyond-band--dark .beyond-inner { margin-right: clamp(24px, 4vw, 64px); margin-left: auto; }
  .beyond-band--light .beyond-inner { margin-left: clamp(24px, 4vw, 64px); margin-right: auto; }
}

.beyond-eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.beyond-band--dark .beyond-eyebrow { color: rgba(237, 232, 222, 0.55); }
.beyond-eyebrow--accent { color: var(--accent); }
.beyond-band--dark .beyond-eyebrow--accent { color: var(--accent); }

.beyond-h {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(22px, 3.2vw, 48px);
  line-height: 1.1;
  letter-spacing: -0.022em;
  margin: 4px 0 8px;
  text-wrap: pretty;
}
@media (max-width: 600px) {
  .beyond-h { font-size: clamp(22px, 7vw, 34px); }
}

.beyond-p {
  font-family: var(--sans);
  font-size: clamp(16px, 1.15vw, 18px);
  line-height: 1.55;
  max-width: 48ch;
  color: inherit;
  opacity: 0.78;
  text-wrap: pretty;
  margin: 0;
}

.beyond-cta {
  margin-top: clamp(16px, 2vw, 28px);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
  border: 1px solid rgba(26, 24, 20, 0.32);
  padding: 8px 14px;
  border-radius: 999px;
  width: fit-content;
  transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, gap 0.25s ease;
}
.beyond-cta .arr { display: inline-block; transition: transform 0.25s ease; }
.beyond-cta:hover {
  gap: 12px;
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(181, 70, 44, 0.06);
}
.beyond-cta:hover .arr { transform: translate(2px, -2px); }


/* ── Letter modal ────────────────────────────────────────── */

.letter-cta {
  margin-top: clamp(20px, 2.5vw, 32px);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #EDE8DE;
  background: transparent;
  border: 1px solid rgba(237, 232, 222, 0.32);
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  width: fit-content;
}
.letter-cta:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(181, 70, 44, 0.08);
}
.letter-cta-glyph { display: inline-flex; transition: transform 0.25s ease; }
.letter-cta:hover .letter-cta-glyph { transform: translateY(-1px) rotate(-6deg); }

/* ── Stage ── */
.letter-stage {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  cursor: none;
}
.letter-stage * { cursor: none; }

.letter-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(14, 13, 11, 0.72);
  -webkit-backdrop-filter: blur(18px) saturate(120%);
  backdrop-filter: blur(18px) saturate(120%);
  opacity: 0;
  transition: opacity 0.4s ease;
}
.letter-stage.stage-open .letter-backdrop,
.letter-stage.stage-opening .letter-backdrop { opacity: 1; }
.letter-stage.stage-closing .letter-backdrop { opacity: 0; transition-duration: 0.35s; }

.letter-close { display: none; }

/* ── Cursor pill ── */
.letter-cursor {
  position: fixed;
  pointer-events: none;
  z-index: 250;
  transform: translate(18px, 14px);
  background: #FBFAF6;
  color: #14110D;
  padding: 8px 14px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  white-space: nowrap;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.5);
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  will-change: transform, left, top;
}
.letter-cursor--inside {
  background: #14110D;
  color: #FBFAF6;
}
.letter-cursor--copied {
  background: var(--accent);
  color: #FBFAF6;
  transform: translate(18px, 14px) scale(1.04);
}
.letter-cursor svg { flex-shrink: 0; }

/* ── Scene ── */
.letter-scene {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(40px, 5vh, 72px) clamp(16px, 4vw, 56px);
}

/* ── Paper ── */
.letter-paper {
  position: relative;
  width: 100%;
  max-width: 720px;
  max-height: 100%;
  background: #FBFAF6;
  border-radius: 8px;
  box-shadow:
    0 40px 100px -30px rgba(0, 0, 0, 0.6),
    0 16px 40px -16px rgba(0, 0, 0, 0.35),
    0 0 0 1px rgba(0, 0, 0, 0.04);
  opacity: 0;
  transform: translateY(28px) scale(0.985);
  transition:
    transform 0.6s cubic-bezier(.2, .8, .25, 1),
    opacity 0.45s ease;
  will-change: transform;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.letter-stage.stage-opening .letter-paper,
.letter-stage.stage-open .letter-paper {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.letter-stage.stage-closing .letter-paper {
  opacity: 0;
  transform: translateY(20px) scale(0.99);
  transition-duration: 0.32s;
}

.letter-paper-scroll {
  position: relative;
  flex: 0 1 auto;
  overflow: hidden;
  padding: clamp(40px, 5.5vw, 72px) clamp(32px, 6vw, 80px);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}
.letter-paper-scroll::-webkit-scrollbar { width: 8px; }
.letter-paper-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.18); border-radius: 4px; }
.letter-paper-scroll::-webkit-scrollbar-track { background: transparent; }

/* Content stagger */
.letter-paper-scroll > * {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.55s ease, transform 0.55s ease;
}
.letter-stage.stage-open .letter-paper-scroll > *,
.letter-stage.stage-opening .letter-paper-scroll > * {
  opacity: 1;
  transform: translateY(0);
}
.letter-stage.stage-open .letter-paper-scroll > *:nth-child(1),
.letter-stage.stage-opening .letter-paper-scroll > *:nth-child(1) { transition-delay: 0.22s; }
.letter-stage.stage-open .letter-paper-scroll > *:nth-child(2),
.letter-stage.stage-opening .letter-paper-scroll > *:nth-child(2) { transition-delay: 0.32s; }

/* ── Body ── */
.letter-body {
  font-family: var(--serif);
  color: #14110D;
  font-size: clamp(17px, 1.3vw, 21px);
  line-height: 1.5;
  letter-spacing: -0.003em;
  text-wrap: pretty;
  max-width: 58ch;
  margin: 0 auto;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 1.2vw, 18px);
}
.letter-body p { margin: 0; }
.letter-body p em { font-style: italic; color: #14110D; }
.letter-salutation {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(24px, 2.2vw, 34px) !important;
  line-height: 1.1 !important;
  color: #14110D;
  letter-spacing: -0.015em !important;
  margin: 0 0 clamp(6px, 0.8vw, 12px) !important;
}
.letter-accent { color: var(--accent); font-style: italic; white-space: nowrap; }
.letter-sig {
  font-family: 'Caveat', 'Instrument Serif', serif !important;
  font-weight: 500;
  font-style: normal;
  font-size: clamp(34px, 3.2vw, 48px) !important;
  line-height: 1 !important;
  color: #14110D;
  margin: clamp(14px, 1.6vw, 24px) 0 0 !important;
  letter-spacing: 0;
  display: inline-block;
}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'), []
  );
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  const __twkIsLight = (hex) => {
    const h = String(hex).replace('#', '');
    const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
    const n = parseInt(x.slice(0, 6), 16);
    if (Number.isNaN(n)) return true;
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return r * 299 + g * 587 + b * 114 > 148000;
  };
  const TwkCheck = ({ light }) => (
    <svg viewBox="0 0 14 14" aria-hidden="true">
      <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
            strokeLinecap="round" strokeLinejoin="round"
            stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
    </svg>
  );
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakColor,
});

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add('in');
            io.unobserve(e.target);
          }
        });
      },
      { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function Letter() {
  const [phase, setPhase] = React.useState('closed');
  const [cursor, setCursor] = React.useState({ x: -200, y: -200, visible: false });
  const [mode, setMode] = React.useState('outside');
  const copiedTimerRef = React.useRef(null);

  const EMAIL = 'jurackova.klaudia@gmail.com';

  const open = () => {
    if (phase !== 'closed') return;
    setMode('outside');
    setPhase('opening');
    window.setTimeout(() => setPhase('open'), 30);
  };

  const close = () => {
    if (phase === 'closed' || phase === 'closing') return;
    setPhase('closing');
    window.setTimeout(() => setPhase('closed'), 520);
  };

  React.useEffect(() => {
    if (phase === 'closed') return;
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = prevOverflow;
      if (copiedTimerRef.current) window.clearTimeout(copiedTimerRef.current);
    };
  }, [phase]);

  React.useEffect(() => {
    if (phase === 'closed') return;
    const onMove = (e) => setCursor({ x: e.clientX, y: e.clientY, visible: true });
    const onLeave = () => setCursor((c) => ({ ...c, visible: false }));
    window.addEventListener('mousemove', onMove);
    document.addEventListener('mouseleave', onLeave);
    return () => {
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseleave', onLeave);
    };
  }, [phase]);

  const onPaperClick = (e) => {
    e.stopPropagation();
    const fallbackCopy = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = EMAIL;
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch {}
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(EMAIL).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
    setMode('copied');
    if (copiedTimerRef.current) window.clearTimeout(copiedTimerRef.current);
    copiedTimerRef.current = window.setTimeout(() => setMode('inside'), 1600);
  };

  const cursorLabel =
    mode === 'copied' ? 'Email copied' :
    mode === 'inside' ? 'Click to copy email' :
    'Click to close';

  const modal = phase !== 'closed' && (
    <div className={`letter-stage stage-${phase}`} onClick={close}>
      <div className="letter-backdrop" />
      <div className="letter-scene">
        <article
          className="letter-paper"
          onClick={onPaperClick}
          onMouseEnter={() => setMode('inside')}
          onMouseLeave={() => setMode('outside')}
          role="dialog"
          aria-modal="true"
          aria-label="A letter from Klaudia">
          <div className="letter-paper-scroll">
            <div className="letter-body">
              <p className="letter-salutation">Hi there,</p>
              <p>
                What I've learned in the past 5+ years designing is that the
                design work is rarely the hardest part. The hardest part is
                getting people aligned. Game designers, engineers, producers,
                leadership. Everyone with their own priorities, their own
                pressures, their own version of what <em>good</em> looks like.
              </p>
              <p>
                And that's where I do my best work. I bring order to messy
                rooms. I write the doc nobody else wrote. I run the meeting
                that should have happened weeks ago. I find the thread when
                everyone's talking past each other. I also really enjoy
                presenting my designs to stakeholders and articulating the
                design decisions behind them.
              </p>
              <p>
                If you're looking for someone who can do both: design the
                thing <em>and</em> design the way the team works around it,
                <span className="letter-accent"> I'd love to connect</span>.
              </p>
              <p className="letter-sig">— Klaudia</p>
            </div>
          </div>
        </article>
      </div>
      {cursor.visible && (
        <div
          className={`letter-cursor letter-cursor--${mode}`}
          style={{ left: cursor.x, top: cursor.y }}
          aria-hidden="true">
          <span>{cursorLabel}</span>
          {mode === 'copied' && (
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M3 8.5 L6.5 12 L13 4.5" />
            </svg>
          )}
        </div>
      )}
    </div>
  );

  return (
    <>
      <button className="letter-cta" onClick={open} type="button">
        <span className="letter-cta-glyph" aria-hidden>
          <svg viewBox="0 0 20 14" width="14" height="10" fill="none" stroke="currentColor" strokeWidth="1.4">
            <rect x="0.7" y="0.7" width="18.6" height="12.6" rx="1" />
            <path d="M0.7 1.5 L10 8 L19.3 1.5" />
          </svg>
        </span>
        <span>Read letter</span>
      </button>
      {modal && ReactDOM.createPortal(modal, document.body)}
    </>
  );
}

      }, 50);

    }
  }, []);

  return (
    <>
      <Nav />

      <Hero variant={t.heroVariant} />

      <section className="section">
        <div className="shell">
          <SectionHead
            id="work"
            num="01"
            title="Selected <em>work</em>"
            aside="Case studies · 2022 — 2026"
          />
          <Work />
        </div>
      </section>

      {t.showTeaching && (
        <>
          <hr className="rule" />
          <section className="section section--bleed" id="about">
            <Teaching />
          </section>
        </>
      )}

      <hr className="rule" />

      <section className="section">
        <div className="shell">
          <SectionHead
            id="quotes"
            num={t.showTeaching ? "03" : "02"}
            title="What <em>people</em> say"

          />

        </div>
      </section>

      <Contact />

      <Tweaks t={t} setTweak={setTweak} />
    </>
  );
}

function shade(hex, amt) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  const adj = (c) => {
    if (amt < 0) return Math.max(0, Math.round(c * (1 + amt)));
    return Math.min(255, Math.round(c + (255 - c) * amt));
  };
  const toHex = (n) => n.toString(16).padStart(2, '0');
  return '#' + toHex(adj(r)) + toHex(adj(g)) + toHex(adj(b));
}
