<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lead UX Designer — Klaudia · Case Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F4EFE6;
      --paper-soft: #EDE6DA;
      --paper-deep: #E4DBCB;
      --ink: #1A1814;
      --ink-soft: #4A463E;
      --ink-mute: #7A746A;
      --ink-faint: #B8B0A2;
      --rule: rgba(26, 24, 20, 0.14);
      --rule-soft: rgba(26, 24, 20, 0.07);
      --accent: #B5462C;
      --serif: "Instrument Serif", "Times New Roman", serif;
      --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.5;
      font-weight: 400;
      font-feature-settings: "ss01", "ss02";
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    body {
      background-image:
        radial-gradient(rgba(26,24,20,0.025) 1px, transparent 1px),
        radial-gradient(rgba(26,24,20,0.018) 1px, transparent 1px);
      background-size: 3px 3px, 7px 7px;
      background-position: 0 0, 1px 2px;
    }
    ::selection { background: var(--accent); color: var(--paper); }
    a { color: inherit; text-decoration: none; }

    .shell {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
    }
    @media (max-width: 700px) { .shell { padding: 0 20px; } }

    .nav {
      position: sticky;
      top: 0;
      z-index: 110;
      background: color-mix(in oklab, var(--paper) 85%, transparent);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border-bottom: 1px solid var(--rule-soft);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .nav-mark {
      font-family: var(--serif);
      font-style: italic;
      font-size: 22px;
      letter-spacing: -0.01em;
    }
    .nav-mark sup {
      font-family: var(--mono);
      font-style: normal;
      font-size: 9px;
      letter-spacing: 0.12em;
      vertical-align: super;
      margin-left: 4px;
      color: var(--ink-mute);
    }
    .nav-links {
      display: flex;
      gap: 28px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .nav-links a { position: relative; padding: 6px 0; }
    .nav-links a:hover { color: var(--ink); }
    .nav-burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      position: relative;
      z-index: 110;
    }
    .nav-burger-bar {
      display: block;
      width: 22px;
      height: 1.5px;
      background: var(--ink);
      border-radius: 2px;
      transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity 0.2s ease,
                  top 0.35s cubic-bezier(0.23, 1, 0.32, 1);
      position: absolute;
    }
    .nav-burger-bar:nth-child(1) { top: calc(50% - 7px); }
    .nav-burger-bar:nth-child(2) { top: calc(50% - 0.75px); }
    .nav-burger-bar:nth-child(3) { top: calc(50% + 5.5px); }
    .nav-burger[aria-expanded="true"] .nav-burger-bar:nth-child(1) { top: calc(50% - 0.75px); transform: rotate(45deg); }
    .nav-burger[aria-expanded="true"] .nav-burger-bar:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-burger[aria-expanded="true"] .nav-burger-bar:nth-child(3) { top: calc(50% - 0.75px); transform: rotate(-45deg); }
    .nav-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 80px clamp(32px, 8vw, 64px) clamp(32px, 6vw, 48px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 0.35s;
    }
    .nav-overlay.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 0s;
    }
    .nav-overlay-links {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .nav-overlay-links a {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1;
      color: var(--ink-soft);
      text-decoration: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), color 0.15s ease;
    }
    .nav-overlay.open .nav-overlay-links a:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 0.05s; }
    .nav-overlay.open .nav-overlay-links a:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
    .nav-overlay.open .nav-overlay-links a:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 0.15s; }
    .nav-overlay-links a:hover { color: var(--ink); }
    @media (max-width: 760px) { .nav-links { display: none; } .nav-burger { display: flex; } }

    .reveal { opacity: 1; transform: none; }
    .reveal.in { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

    .cs-progress {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      z-index: 100;
      background: transparent;
      pointer-events: none;
    }
    .cs-progress .bar {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    .cs-shell {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
    }
    .cs-hero-v2.cs-shell {
      max-width: 880px;
    }
    @media (max-width: 900px) { .cs-shell { padding: 0 24px; } }

    .cs-hero-v2 {
      padding-top: clamp(64px, 10vw, 120px);
      padding-bottom: clamp(40px, 6vw, 64px);
      display: flex;
      flex-direction: column;
      gap: clamp(20px, 3vw, 40px);
    }
    @media (max-width: 900px) {
      .cs-hero-v2 { padding-top: 56px; padding-bottom: 32px; }
    }
    .cs-hero-v2-eyebrow {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }
    .cs-hero-v2-h {
      font-family: var(--serif);
      font-size: clamp(48px, 7vw, 120px);
      line-height: 1.02;
      letter-spacing: -0.025em;
      font-weight: 400;
      margin: 0;
      color: var(--ink);
      text-wrap: balance;
    }
    .cs-hero-v2-h em { font-style: italic; color: var(--accent); }
    .cs-hero-v2-dek {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(22px, 2.2vw, 32px);
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--ink-soft);
      margin: 0;
      max-width: 36ch;
      text-wrap: pretty;
    }
    .cs-nda-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: var(--paper-soft);
    }
    .cs-nda-pill::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .cs-meta {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: clamp(20px, 3vw, 40px);
      padding: clamp(28px, 4vw, 44px) 32px;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      margin-top: clamp(32px, 4vw, 56px);
    }
    .cs-meta > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .cs-meta .k {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }
    .cs-meta .v {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.3;
      text-wrap: pretty;
    }
    .cs-meta .v em { font-style: italic; color: var(--accent); font-weight: 400; }
    .info-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--ink-faint);
      background: none;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: border-color 0.15s ease, color 0.15s ease;
      color: var(--ink-faint);
      vertical-align: middle;
      position: relative;
      top: -1px;
      margin-left: 5px;
      -webkit-tap-highlight-color: transparent;
    }
    .info-btn::before {
      content: '';
      position: absolute;
      inset: -12px;
    }
    .info-btn:hover { border-color: var(--ink); color: var(--ink); }
    .info-btn svg { display: block; }
    .info-tooltip {
      position: fixed;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9999;
    }
    .info-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--ink);
    }
    @media (max-width: 1000px) { .cs-meta { grid-template-columns: repeat(3, 1fr); row-gap: 24px; } }
    @media (max-width: 540px) { .cs-meta { grid-template-columns: repeat(2, 1fr); } }

    .cs-body {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: clamp(40px, 6vw, 96px);
      padding-top: clamp(64px, 9vw, 120px);
      padding-bottom: clamp(64px, 9vw, 120px);
      align-items: start;
    }
    @media (max-width: 1000px) { .cs-body { grid-template-columns: 1fr; gap: 32px; } }

    .cs-toc {
      position: sticky;
      top: 92px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .cs-toc .toc-label {
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--ink-mute);
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--rule);
    }
    .cs-toc a {
      display: flex;
      gap: 12px;
      align-items: baseline;
      padding: 6px 0;
      color: var(--ink-mute);
      transition: color 0.18s ease;
    }
    .cs-toc a .num { color: var(--ink-faint); font-size: 10px; letter-spacing: 0.1em; }
    .cs-toc a:hover { color: var(--ink); }
    .cs-toc a.active { color: var(--accent); }
    .cs-toc a.active .num { color: var(--accent); }
    @media (max-width: 1000px) { .cs-toc { display: none; } }

    .cs-prose { max-width: 760px; min-width: 0; }
    .cs-section {
      padding: clamp(40px, 5vw, 72px) 0;
      border-top: 1px solid var(--rule);
    }
    .cs-section:first-child { border-top: none; padding-top: 0; }
    .cs-section > h2 {
      font-family: var(--serif);
      font-size: clamp(32px, 3.8vw, 56px);
      line-height: 1;
      letter-spacing: -0.025em;
      font-weight: 400;
      margin: 0 0 clamp(20px, 2.5vw, 32px);
      color: var(--ink);
      text-wrap: balance;
    }
    .cs-section > h2 em { font-style: italic; color: var(--accent); }
    .cs-prose .lede {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(22px, 1.9vw, 28px);
      line-height: 1.35;
      letter-spacing: -0.008em;
      color: var(--ink);
      margin: 0 0 24px;
      text-wrap: pretty;
    }
    .cs-prose p {
      font-family: var(--sans);
      font-size: 16.5px;
      line-height: 1.65;
      color: var(--ink-soft);
      margin: 0 0 18px;
      text-wrap: pretty;
    }
    .cs-prose p strong { color: var(--ink); font-weight: 500; }
    .cs-prose p em { font-style: italic; color: var(--ink); }

    .cs-pull {
      margin: clamp(32px, 4vw, 56px) 0;
      padding: clamp(20px, 3vw, 36px) 0 clamp(20px, 3vw, 36px) clamp(20px, 3vw, 32px);
      border-left: 2px solid var(--accent);
      font-family: var(--sans);
      font-style: normal;
      font-size: 16.5px;
      line-height: 1.65;
      letter-spacing: normal;
      color: var(--ink-soft);
      text-wrap: pretty;
    }

    .cs-note {
      margin: 18px 0 28px;
      padding: 14px 16px;
      background: var(--paper-soft);
      border-left: 2px solid var(--ink-faint);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .cs-note .label {
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-mute);
      padding-top: 1px;
    }
    .cs-note p { margin: 0; font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--ink-soft); }

    .cs-resp {
      list-style: none;
      margin: 0 0 clamp(20px, 2vw, 28px);
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .cs-resp li {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 16px;
      padding: 16px 0;
      border-top: 1px solid var(--rule-soft);
    }
    .cs-resp li:first-child { border-top: none; }
    .cs-resp li .num {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-mute);
      padding-top: 4px;
    }
    .cs-resp li .t {
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink);
      text-wrap: pretty;
    }

    .cs-artefact { margin: clamp(28px, 4vw, 48px) 0; }
    .cs-artefact-board {
      background: var(--paper-soft);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: clamp(20px, 3vw, 32px);
      overflow: auto;
    }

    .pipeline-swim { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .pipeline-swim svg { display: block; width: 100%; min-width: 900px; height: auto; }
    .ps-band { fill: var(--paper-soft); }
    .ps-h    { stroke: var(--rule); stroke-width: 1; }
    .ps-v    { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.65; }
    .ps-v-solid { stroke: var(--rule); stroke-width: 1; }
    .ps-phase { fill: var(--ink-mute); font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
    .ps-role  { fill: var(--ink); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; }
    .ps-arrow { fill: none; stroke: var(--ink-mute); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .ps-rect  { stroke-width: 1.25; }
    .ps-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em; font-weight: 500; }
    .ps-node.ps-gd   .ps-rect  { fill: var(--paper); stroke: var(--ink); }
    .ps-node.ps-gd   .ps-label { fill: var(--ink); }
    .ps-node.ps-ux   .ps-rect  { fill: var(--accent); stroke: var(--accent); }
    .ps-node.ps-ux   .ps-label { fill: var(--paper); }
    .ps-node.ps-ui   .ps-rect  { fill: var(--paper); stroke: var(--accent); }
    .ps-node.ps-ui   .ps-label { fill: var(--accent); }
    .ps-node.ps-tech .ps-rect  { fill: var(--ink); stroke: var(--ink); }
    .ps-node.ps-tech .ps-label { fill: var(--paper); }
    .pipeline-swim-legend {
      display: flex; flex-wrap: wrap; gap: 18px; margin-top: 18px;
      font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute);
    }
    .psl-item { display: inline-flex; align-items: center; gap: 8px; }
    .psl-sw { display: inline-block; width: 18px; height: 12px; border-radius: 2px; border: 1.25px solid var(--ink); background: var(--paper); }
    .psl-item.ps-ux   .psl-sw { background: var(--accent); border-color: var(--accent); }
    .psl-item.ps-ui   .psl-sw { background: var(--paper); border-color: var(--accent); }
    .psl-item.ps-tech .psl-sw { background: var(--ink); border-color: var(--ink); }
    @media (max-width: 700px) { .pipeline-swim-legend { gap: 12px; font-size: 9.5px; } }

    .doc-template { width: 100%; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
    .doc-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 2fr;
      gap: 18px;
      padding: 12px 18px;
      border-top: 1px solid var(--rule);
      align-items: baseline;
      font-family: var(--sans);
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--ink);
    }
    .doc-row:first-child { border-top: 0; }
    .doc-row--head {
      background: var(--ink); color: var(--paper); padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .doc-title { color: var(--paper); font-weight: 500; }
    .doc-meta { color: rgba(244, 239, 230, 0.55); font-size: 10px; }
    .doc-k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); font-weight: 500; }
    .doc-v { color: var(--ink); }
    .doc-v.is-placeholder { color: var(--ink-faint); font-style: italic; }
    .doc-pill {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink); background: var(--paper-soft); border: 1px solid var(--rule);
      padding: 4px 10px 4px 8px; border-radius: 999px; font-style: normal;
    }
    .doc-pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .doc-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 11.5px; color: var(--accent);
      font-style: normal; text-decoration: none; border-bottom: 1px dashed currentColor; padding-bottom: 1px;
    }
    .doc-link::after { content: "↗"; font-size: 10px; }
    .doc-video { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--ink); font-style: normal; }
    .doc-video-thumb {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 14px; border-radius: 2px; background: var(--ink); color: var(--paper); flex-shrink: 0;
    }
    @media (max-width: 600px) { .doc-row { grid-template-columns: 1fr; gap: 4px; } }

    .mf { display: flex; flex-direction: column; gap: 0; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
    .mf-row { display: grid; grid-template-columns: 96px 1fr; gap: 24px; padding: 22px 20px; border-top: 1px solid var(--rule); align-items: start; }
    .mf-row:first-child { border-top: 0; }
    .mf-step { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); padding-top: 4px; }
    .mf-content { display: flex; flex-direction: column; gap: 12px; }
    .mf-title { font-family: var(--serif); font-size: 22px; line-height: 1.15; letter-spacing: -0.012em; margin: 0; color: var(--ink); font-weight: 400; }
    .mf-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

// ── Reveal hook ─────────────────────────────────────────
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add('in');
            io.unobserve(e.target);
          }
        });
      },
      { threshold: 0.1, rootMargin: '0px 0px -40px 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

// ── Info tooltip button ─────────────────────────────────
function InfoBtn({ tip }) {
  const [pos, setPos] = React.useState(null);
  const btnRef = React.useRef(null);
  const open = () => {
    const r = btnRef.current.getBoundingClientRect();
    setPos({ top: r.top - 8, left: r.left + r.width / 2 });
  };
  const close = () => setPos(null);
  React.useEffect(() => {
    if (!pos) return;
    const handler = () => close();
    document.addEventListener('pointerdown', handler, true);
    return () => document.removeEventListener('pointerdown', handler, true);
  }, [pos]);
  return (
    <>
      <button ref={btnRef} className="info-btn" aria-label="More info"
        onClick={(e) => { e.stopPropagation(); e.preventDefault(); pos ? close() : open(); }}>
        <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor">
          <rect x="3.2" y="3" width="1.6" height="3.8" rx="0.8"/>
          <circle cx="4" cy="1.5" r="0.9"/>
        </svg>
      </button>
      {pos && ReactDOM.createPortal(
        <div className="info-tooltip" style={{ top: pos.top, left: pos.left, transform: 'translateX(-50%) translateY(-100%)' }}>
          {tip}
        </div>,
        document.body
      )}
    </>
  );
}

// ── TOC ─────────────────────────────────────────────────
const SECTIONS = [
{ id: "context", num: "00", label: "Context" },
{ id: "what-i-did", num: "01", label: "What I did" },
{ id: "pipeline", num: "02", label: "UX Pipeline" },

{ id: "roadmap", num: "05", label: "UX Roadmap" },
{ id: "outcome", num: "06", label: "Outcome" }];


function TOC() {
  const [active, setActive] = useState("context");
  useEffect(() => {
    const targets = SECTIONS.map((s) => document.getElementById(s.id)).filter(Boolean);
    if (!targets.length) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) setActive(e.target.id);
        });
      },
      { rootMargin: "-30% 0px -60% 0px", threshold: 0 }
    );
    targets.forEach((t) => io.observe(t));
    return () => io.disconnect();
  }, []);
  return (
    <aside className="cs-toc">
      <span className="toc-label">On this page</span>
      {SECTIONS.map((s) =>
      <a key={s.id} href={`#${s.id}`} className={active === s.id ? "active" : ""}>
          <span className="num">{s.num}</span>
          <span>{s.label}</span>
        </a>
      )}
    </aside>);

}

// ── ARTEFACT — Pipeline diagram (swim lanes) ────────────
function PipelineDiagram() {
  // Layout constants (kept simple — see SVG below for actual positions)
  const phases = [
    "Brief", "Discovery", "GD review", "Lo-fi", "GD review",
    "Hi-fi", "GD review", "UI design", "UX review", "Sign-off"
  ];
  // x-centers per phase (100px columns starting at x=110)
  const cx = (i) => 160 + i * 100;

  // Nodes: lane index (0..3) + phase index, label
  const nodes = [
    { lane: 0, ph: 0, t: "Brief",     v: "gd" },
    { lane: 1, ph: 1, t: "Discovery", v: "ux" },
    { lane: 0, ph: 2, t: "GD review", v: "gd" },
    { lane: 1, ph: 3, t: "Lo-fi",     v: "ux" },
    { lane: 0, ph: 4, t: "GD review", v: "gd" },
    { lane: 1, ph: 5, t: "Hi-fi",     v: "ux" },
    { lane: 0, ph: 6, t: "GD review", v: "gd" },
    { lane: 2, ph: 7, t: "UI design", v: "ui" },
    { lane: 1, ph: 8, t: "UX review", v: "ux" },
    { lane: 0, ph: 9, t: "Sign-off",  v: "gd" },
    { lane: 3, ph: 9, t: "Build",     v: "tech" }
  ];

  // Lane y-centers
  const ly = [80, 165, 250, 325];
  // Node positioning (rect top-left and label)
  const nodeRect = (n) => {
    const cyVal = ly[n.lane];
    return { x: cx(n.ph) - 42, y: cyVal - 19, w: 84, h: 38, cx: cx(n.ph), cy: cyVal };
  };

  // Arrows — drawn between consecutive nodes through the lane gutter (y=120 or y=210)
  // Format: [fromIdx, toIdx, viaY]
  const arrows = [
    [0, 1, 120],
    [1, 2, 120],
    [2, 3, 120],
    [3, 4, 120],
    [4, 5, 120],
    [5, 6, 120],
    [6, 7, 210], // GD review → UI design (crosses both gutters)
    [7, 8, 210], // UI design → UX review (back up)
    [8, 9, 120], // UX review → Sign-off
    [9, 10, "side"] // Sign-off → Build (down the side)
  ];

  const arrowPath = (fromIdx, toIdx, viaY) => {
    const a = nodeRect(nodes[fromIdx]);
    const b = nodeRect(nodes[toIdx]);

    if (viaY === "side") {
      // From Sign-off (right edge) down outside, then into Build (right edge)
      const sx = a.x + a.w;
      const sy = a.cy;
      const ex = b.x + b.w;
      const ey = b.cy;
      return `M${sx + 2},${sy} L${sx + 8},${sy} L${sx + 8},${ey} L${ex + 2},${ey}`;
    }

    // Vertical-out from top or bottom of "from", run along gutter, drop into top/bottom of "to"
    const fromTop = a.cy < viaY; // node is above the gutter → exit downward
    const toTop = b.cy < viaY;   // node is above the gutter → enter from below

    const sx = a.cx;
    const sy = fromTop ? a.y + a.h : a.y; // exit
    const ex = b.cx;
    const ey = toTop ? b.y + b.h : b.y;   // enter

    return `M${sx},${sy} L${sx},${viaY} L${ex},${viaY} L${ex},${ey}`;
  };

  return (
    <div className="pipeline-swim">
      <svg
        viewBox="0 0 1120 380"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-label="UX pipeline swim lanes: brief through sign-off, with build handoff to UI tech">

        <defs>
          <marker id="ps-arr" viewBox="0 0 10 10" refX="8" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1 L8 5 L2 9" fill="none"
                  stroke="context-stroke" strokeWidth="1.5"
                  strokeLinecap="round" strokeLinejoin="round" />
          </marker>
        </defs>

        {/* Lane bands */}
        <rect className="ps-band" x="110" y="40"  width="1000" height="80" />
        <rect className="ps-band" x="110" y="210" width="1000" height="80" />

        {/* Horizontal lane rules */}
        {[40, 120, 210, 290, 360].map((y) => (
          <line key={y} className="ps-h" x1="0" y1={y} x2="1120" y2={y} />
        ))}

        {/* Role column divider */}
        <line className="ps-v-solid" x1="110" y1="0" x2="110" y2="380" />

        {/* Phase column dividers (dashed) */}
        {[210, 310, 410, 510, 610, 710, 810, 910, 1010].map((x) => (
          <line key={x} className="ps-v" x1={x} y1="40" x2={x} y2="360" />
        ))}

        {/* Phase header labels */}
        {phases.map((p, i) => (
          <text key={i} className="ps-phase" x={cx(i)} y="22" textAnchor="middle">{p}</text>
        ))}

        {/* Role labels */}
        {["Game designer", "UX designer", "UI designer", "UI tech"].map((r, i) => (
          <text key={r} className="ps-role" x="55" y={ly[i]} textAnchor="middle" dominantBaseline="central">{r}</text>
        ))}

        {/* Arrows */}
        {arrows.map(([f, t, via], i) => (
          <path
            key={i}
            className="ps-arrow"
            d={arrowPath(f, t, via)}
            markerEnd="url(#ps-arr)" />
        ))}

        {/* Nodes */}
        {nodes.map((n, i) => {
          const r = nodeRect(n);
          return (
            <g key={i} className={`ps-node ps-${n.v}`}>
              <rect className="ps-rect" x={r.x} y={r.y} width={r.w} height={r.h} rx="6" />
              <text className="ps-label" x={r.cx} y={r.cy} textAnchor="middle" dominantBaseline="central">{n.t}</text>
            </g>
          );
        })}

      </svg>

      <div className="pipeline-swim-legend">
        <span className="psl-item ps-gd"><span className="psl-sw" /> Game designer</span>
        <span className="psl-item ps-ux"><span className="psl-sw" /> UX designer</span>
        <span className="psl-item ps-ui"><span className="psl-sw" /> UI designer</span>
        <span className="psl-item ps-tech"><span className="psl-sw" /> UI tech</span>
      </div>
    </div>
  );
}

// ── Reading progress ────────────────────────────────────
function Progress() {
  const barRef = useRef(null);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const pct = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100;
      if (barRef.current) barRef.current.style.width = `${pct}%`;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <div className="cs-progress">
      <div className="bar" ref={barRef} />
    </div>);

}

    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);
  return (
