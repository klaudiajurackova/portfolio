  <style>
/* ──────────────────────────────────────────────────────────
   Klaudia portfolio — editorial light
   Type: Instrument Serif (display) + Geist (body) + JetBrains Mono (meta)
   ────────────────────────────────────────────────────────── */

:root {
  --paper: #F4EFE6;
  --paper-soft: #EDE6DA;
  --paper-deep: #E4DBCB;
  --ink: #1A1814;
  --ink-soft: #4A463E;
  --ink-mute: #7A746A;
  --ink-faint: #B8B0A2;
  --rule: rgba(26, 24, 20, 0.14);
  --rule-soft: rgba(26, 24, 20, 0.07);
  --accent: #B5462C;

  --serif: "Instrument Serif", "Times New Roman", serif;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --gutter: 32px;
  --col: 96px;

  --t-display: clamp(56px, 11vw, 200px);
  --t-h1: clamp(40px, 5.6vw, 92px);
  --t-h2: clamp(28px, 3.4vw, 56px);
  --t-h3: clamp(20px, 1.7vw, 28px);
  --t-body: 17px;
  --t-meta: 12px;
}

@media (max-width: 700px) {
  :root { --gutter: 18px; }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--t-body);
  line-height: 1.5;
  font-weight: 400;
  font-feature-settings: "ss01", "ss02";
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

body {
  /* paper grain */
  background-image:
    radial-gradient(rgba(26,24,20,0.025) 1px, transparent 1px),
    radial-gradient(rgba(26,24,20,0.018) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 1px 2px;
}

::selection { background: var(--accent); color: var(--paper); }

a { color: inherit; text-decoration: none; }

/* ── Typography utilities ─────────────────────────────── */

.serif { font-family: var(--serif); font-weight: 400; }
.serif-i { font-family: var(--serif); font-weight: 400; font-style: italic; }
.mono { font-family: var(--mono); font-weight: 400; font-feature-settings: "ss01"; }

.display {
  font-family: var(--serif);
  font-size: var(--t-display);
  line-height: 0.9;
  letter-spacing: -0.025em;
  font-weight: 400;
}
.display em {
  font-style: italic;
  letter-spacing: -0.015em;
}

.h1 {
  font-family: var(--serif);
  font-size: var(--t-h1);
  line-height: 0.98;
  letter-spacing: -0.02em;
  font-weight: 400;
}
.h2 {
  font-family: var(--serif);
  font-size: var(--t-h2);
  line-height: 1.02;
  letter-spacing: -0.018em;
  font-weight: 400;
}
.h3 {
  font-family: var(--sans);
  font-size: var(--t-h3);
  line-height: 1.25;
  letter-spacing: -0.01em;
  font-weight: 500;
}

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 400;
}

.lede {
  font-family: var(--sans);
  font-size: clamp(19px, 1.55vw, 24px);
  line-height: 1.45;
  color: var(--ink-soft);
  font-weight: 400;
  letter-spacing: -0.005em;
  text-wrap: pretty;
  max-width: 36ch;
}

.body-lg {
  font-size: 18px;
  line-height: 1.55;
  color: var(--ink-soft);
  text-wrap: pretty;
}

/* ── Layout ───────────────────────────────────────────── */

.shell {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 32px;
}
@media (max-width: 1100px) {
  .shell { padding: 0 32px; }
}
@media (max-width: 700px) {
  .shell { padding: 0 20px; }
}

.section {
  padding: clamp(56px, 9vw, 96px) 0;
  position: relative;
}
.section--dense { padding: clamp(40px, 6vw, 64px) 0; }
.section--hero { padding: clamp(64px, 10vw, 120px) 0 clamp(40px, 5vw, 64px); }

[data-density="airy"] .section { padding: clamp(72px, 12vw, 128px) 0; }
[data-density="dense"] .section { padding: clamp(40px, 6vw, 64px) 0; }

.rule {
  height: 1px;
  background: var(--rule);
  border: 0;
  margin: 0;
}

/* ── Nav ──────────────────────────────────────────────── */

.nav {
  position: sticky;
  top: 0;
  z-index: 110;
  background: color-mix(in oklab, var(--paper) 85%, transparent);
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  border-bottom: 1px solid var(--rule-soft);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.nav-mark {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  letter-spacing: -0.01em;
}
.nav-mark sup {
  font-family: var(--mono);
  font-style: normal;
  font-size: 9px;
  letter-spacing: 0.12em;
  vertical-align: super;
  margin-left: 4px;
  color: var(--ink-mute);
}
.nav-links {
  display: flex;
  gap: 28px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.nav-links a { position: relative; padding: 6px 0; }
.nav-links a:hover { color: var(--ink); }
.nav-cta {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--paper);
  background: var(--ink);
  padding: 9px 14px;
  border-radius: 999px;
  white-space: nowrap;
  transition: transform 0.18s ease, background 0.18s ease;
}
.nav-cta:hover { background: var(--accent); }
.nav-burger {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 40px;
  height: 40px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  position: relative;
  z-index: 110;
}
.nav-burger-bar {
  display: block;
  width: 22px;
  height: 1.5px;
  background: var(--ink);
  border-radius: 2px;
  transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1),
              opacity 0.2s ease,
              top 0.35s cubic-bezier(0.23, 1, 0.32, 1);
  position: absolute;
}
.nav-burger-bar:nth-child(1) { top: calc(50% - 7px); }
.nav-burger-bar:nth-child(2) { top: calc(50% - 0.75px); }
.nav-burger-bar:nth-child(3) { top: calc(50% + 5.5px); }
.nav-burger[aria-expanded="true"] .nav-burger-bar:nth-child(1) { top: calc(50% - 0.75px); transform: rotate(45deg); }
.nav-burger[aria-expanded="true"] .nav-burger-bar:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav-burger[aria-expanded="true"] .nav-burger-bar:nth-child(3) { top: calc(50% - 0.75px); transform: rotate(-45deg); }
.nav-overlay {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: flex-start;
  padding: 80px clamp(32px, 8vw, 64px) clamp(32px, 6vw, 48px);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 0.35s;
}
.nav-overlay.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 0s;
}
.nav-overlay-links {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.nav-overlay-links a {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1;
  color: var(--ink-soft);
  text-decoration: none;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), color 0.15s ease;
}
.nav-overlay.open .nav-overlay-links a:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 0.05s; }
.nav-overlay.open .nav-overlay-links a:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
.nav-overlay.open .nav-overlay-links a:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 0.15s; }
.nav-overlay-links a:hover { color: var(--ink); }
@media (max-width: 760px) {
  .nav-links { display: none; }
  .nav-burger { display: flex; }
}

/* ── Hero ─────────────────────────────────────────────── */

.hero {
  padding: clamp(40px, 6vw, 64px) 0 0;
}
.hero-meta {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
  align-items: start;
  margin-bottom: clamp(72px, 10vw, 128px);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.hero-meta > div { grid-column: span 3; }
.hero-meta b { display: block; color: var(--ink); font-weight: 500; margin-top: 6px; letter-spacing: 0.04em; line-height: 1.35; text-wrap: balance; }

.hero-statement {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
  align-items: end;
}
.hero-statement .text { grid-column: 1 / span 9; }
.hero-statement .meta { grid-column: 10 / span 3; padding-bottom: 10px; }
.hero-statement--solo .text { grid-column: 1 / -1; }

/* Kill h1 default margin so subline can sit tight under the headline */
.hero-statement h1 {
  margin: 0;
}

.hero-statement-sub {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(22px, 2vw, 30px);
  line-height: 1.3;
  letter-spacing: -0.008em;
  color: var(--ink-soft);
  margin: 16px 0 0;
  max-width: 36ch;
  text-wrap: pretty;
}

.hero-statement-cta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: clamp(28px, 3vw, 40px);
}

@media (max-width: 700px) {
  .hero-meta { display: none; }
  .hero { padding-top: clamp(24px, 6vw, 40px); }
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-radius: 999px;
  text-decoration: none;
  border: 1px solid transparent;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  white-space: nowrap;
}
.btn--primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.btn--primary:hover {
  background: var(--accent);
  border-color: var(--accent);
  transform: translateY(-1px);
}
.btn--primary span { transition: transform 0.2s ease; }
.btn--primary:hover span { transform: translateX(3px); }
.btn--ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--rule);
}
.btn--ghost:hover {
  border-color: var(--ink);
  background: var(--paper-soft);
}

.hero-name {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-name .small {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

.hero-marquee {
  display: flex;
  gap: 56px;
  align-items: center;
  margin-top: clamp(72px, 9vw, 112px);
  padding: 18px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  overflow: hidden;
  white-space: nowrap;
}
.hero-marquee .track {
  display: flex;
  gap: 56px;
  animation: marquee 40s linear infinite;
}
.hero-marquee .dot {
  width: 5px; height: 5px;
  background: var(--accent);
  border-radius: 50%;
  display: inline-block;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

@media (max-width: 900px) {
  .hero-meta > div { grid-column: span 6; }
  .hero-statement .text,
  .hero-statement .meta { grid-column: 1 / -1; }
}

/* ── Section header ───────────────────────────────────── */

.section-head {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-bottom: clamp(32px, 4vw, 56px);
  margin-bottom: clamp(40px, 6vw, 72px);
  border-bottom: 1px solid var(--rule);
}
.section-head .title h2 {
  font-size: clamp(40px, 5.6vw, 88px);
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 0;
}

/* ── Work / Project cards ─────────────────────────────── */

.work-cards {
  display: flex;
  flex-direction: column;
  gap: clamp(72px, 10vw, 140px);
}

.pc-card {
  display: block;
  color: inherit;
  text-decoration: none;
}

.pc-head {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: clamp(24px, 3vw, 36px);
  max-width: 60ch;
}
.pc-eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.pc-title {
  font-family: var(--serif);
  font-size: clamp(32px, 4.4vw, 64px);
  line-height: 1;
  letter-spacing: -0.022em;
  font-weight: 400;
  margin: 0;
  color: var(--ink);
  text-wrap: balance;
  transition: color 0.25s ease;
}
.pc-summary {
  font-family: var(--sans);
  font-size: clamp(17px, 1.35vw, 21px);
  line-height: 1.45;
  color: var(--ink-soft);
  margin: 0;
  max-width: 44ch;
  text-wrap: pretty;
}
.pc-aside {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 4px;
}
.pc-stat {
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
  white-space: nowrap;
}
.pc-stat-num {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(28px, 2.8vw, 40px);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--accent);
}
.pc-stat-lbl {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  white-space: nowrap;
}
.pc-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--paper-soft);
  border: 1px solid var(--rule);
  border-radius: 999px;
  white-space: nowrap;
}
.pc-pill::before {
  content: "";
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
}

.pc-video {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--paper-deep);
  border-radius: 4px;
  overflow: hidden;
  transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.pc-video image-slot {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.pc-video-tag {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: rgba(26, 24, 20, 0.78);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-radius: 2px;
  pointer-events: none;
  white-space: nowrap;
  backdrop-filter: blur(2px);
}
.pc-video-tag::before {
  content: "";
  width: 5px; height: 5px;
  background: var(--accent);
  border-radius: 50%;
}
.pc-card:hover .pc-video {
  transform: translateY(-2px);
}
.pc-card:hover .pc-title {
  color: var(--accent);
}
.pc-title { transition: color 0.25s ease; }

@media (max-width: 800px) {
  .pc-head { gap: 12px; }
}


/* ── About ────────────────────────────────────────────── */

.about {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
  align-items: start;
}
.about-photo { grid-column: 1 / span 4; }
.about-photo image-slot {
  width: 100%;
  aspect-ratio: 4 / 5;
  border-radius: 4px;
  display: block;
}
.about-photo .caption {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
}
.about-text { grid-column: 6 / span 7; }
.about-text p {
  font-family: var(--serif);
  font-size: clamp(22px, 1.85vw, 30px);
  line-height: 1.32;
  letter-spacing: -0.005em;
  color: var(--ink);
  margin: 0 0 22px;
  text-wrap: pretty;
}
.about-text p em { font-style: italic; color: var(--ink); }
.about-text p .accent { color: var(--accent); font-style: italic; }

.about-facts {
  margin-top: 56px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  border-top: 1px solid var(--rule);
  padding-top: 28px;
}
.about-facts .fact { display: flex; flex-direction: column; gap: 6px; }
.about-facts .fact .k {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-mute);
}
.about-facts .fact .v {
  font-family: var(--serif); font-size: 22px; line-height: 1.2; letter-spacing: -0.01em;
}
.about-facts .fact .v em { font-style: italic; }

/* ── Sticky note (3D, taped) ──────────────────────────── */
.sticky-note {
  --rot: -3.2deg;
  --tilt-x: 7deg;
  --tilt-y: -4deg;
  --note-bg: #FFE373;
  --note-edge: #E5C040;
  --note-shadow: rgba(60, 50, 10, 0.32);
  position: relative;
  display: inline-block;
  padding: 28px 32px 32px;
  max-width: 280px;
  font-family: var(--serif) !important;
  font-style: italic !important;
  font-size: clamp(18px, 1.45vw, 22px) !important;
  line-height: 1.28 !important;
  letter-spacing: -0.005em !important;
  color: #2a1f08 !important;
  text-wrap: balance;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 38%),
    linear-gradient(180deg, color-mix(in oklab, var(--note-bg) 100%, white 8%) 0%, var(--note-bg) 60%, color-mix(in oklab, var(--note-bg) 90%, black 6%) 100%);
  transform-style: preserve-3d;
  transform: rotateZ(var(--rot)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
  box-shadow:
    0 1px 0 var(--note-edge),
    -3px 4px 0 -1px rgba(0,0,0,0.04),
    0 14px 26px -10px var(--note-shadow),
    0 30px 52px -28px rgba(0,0,0,0.4);
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
  will-change: transform;
}
.sticky-note::before {
  /* paper grain */
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1.4px),
    radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1.4px);
  background-size: 4px 4px, 7px 7px;
  background-position: 0 0, 2px 1px;
  mix-blend-mode: multiply;
  opacity: 0.7;
}
.sticky-note::after {
  /* washi tape strip */
  content: "";
  position: absolute;
  top: -12px;
  left: 50%;
  width: 92px;
  height: 22px;
  transform: translateX(-50%) rotate(calc(var(--rot) * -0.7));
  background:
    linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0.22)),
    rgba(220, 215, 195, 0.6);
  border-left: 1px dashed rgba(0,0,0,0.08);
  border-right: 1px dashed rgba(0,0,0,0.08);
  box-shadow: 0 4px 10px -4px rgba(0,0,0,0.25);
  backdrop-filter: blur(1px);
}
.sticky-note:hover {
  transform: rotateZ(calc(var(--rot) * 0.4)) rotateX(3deg) rotateY(-1deg) translateY(-4px);
  box-shadow:
    0 1px 0 var(--note-edge),
    0 22px 38px -14px var(--note-shadow),
    0 44px 68px -28px rgba(0,0,0,0.45);
}

@media (max-width: 1000px) {
  .about-photo { grid-column: 1 / -1; max-width: 360px; }
  .about-text { grid-column: 1 / -1; }
  .about-facts { grid-template-columns: repeat(2, 1fr); }
}

/* ── Process / How I work ─────────────────────────────── */

.process {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
}
.process-intro { grid-column: 1 / span 5; }
.process-list { grid-column: 6 / span 7; }
.process-list ol {
  list-style: none;
  padding: 0;
  margin: 0;
  counter-reset: pl;
}
.process-list li {
  counter-increment: pl;
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 24px;
  padding: 26px 0;
  border-top: 1px solid var(--rule);
  align-items: start;
}
.process-list li:last-child { border-bottom: 1px solid var(--rule); }
.process-list li::before {
  content: counter(pl, decimal-leading-zero);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-mute);
  padding-top: 6px;
}
.process-list li .h {
  font-family: var(--serif);
  font-size: clamp(22px, 1.7vw, 28px);
  line-height: 1.18;
  letter-spacing: -0.012em;
  margin: 0 0 8px;
}
.process-list li .h em { font-style: italic; }
.process-list li .p {
  font-size: 15.5px;
  color: var(--ink-soft);
  line-height: 1.55;
  text-wrap: pretty;
  max-width: 56ch;
}
@media (max-width: 1000px) {
  .process-intro, .process-list { grid-column: 1 / -1; }
}

/* ── Teaching ─────────────────────────────────────────── */

.teaching {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
  align-items: stretch;
}
.teach-card {
  grid-column: span 6;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 36px 36px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: var(--paper-soft);
  position: relative;
  overflow: hidden;
  min-height: 360px;
}
.teach-card::after {
  content: "";
  position: absolute;
  inset: auto -40px -60px auto;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in oklab, var(--accent) 28%, transparent), transparent 70%);
  pointer-events: none;
}
.teach-card .glyph {
  font-family: var(--serif);
  font-style: italic;
  font-size: 60px;
  line-height: 1;
  color: var(--accent);
  letter-spacing: -0.02em;
}
.teach-card .h {
  font-family: var(--serif);
  font-size: 32px;
  line-height: 1.08;
  letter-spacing: -0.018em;
}
.teach-card .h em { font-style: italic; }
.teach-card .p {
  font-size: 15.5px;
  color: var(--ink-soft);
  line-height: 1.55;
  text-wrap: pretty;
}
.teach-card .cta {
  margin-top: auto;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
  width: 100%;
}
.teach-card .cta:hover { color: var(--accent); }
.teach-card .cta .arr { transition: transform 0.2s ease; }
.teach-card:hover .cta .arr { transform: translate(3px, -3px); }
@media (max-width: 900px) {
  .teach-card { grid-column: 1 / -1; min-height: 280px; }
}

/* ── Testimonials ─────────────────────────────────────── */

.quotes {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
}
.quote {
  grid-column: span 4;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 32px 0 0;
  border-top: 1px solid var(--ink);
}
.quote .mark {
  font-family: var(--serif);
  font-style: italic;
  font-size: 64px;
  line-height: 0.6;
  color: var(--accent);
  height: 28px;
}
.quote .body {
  font-family: var(--serif);
  font-size: clamp(20px, 1.5vw, 26px);
  line-height: 1.32;
  letter-spacing: -0.005em;
  text-wrap: pretty;
  flex: 1;
}
.quote .body em { font-style: italic; }
.quote .who {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
}
.quote .who .nm {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
}
.quote .who .rl {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.quote.placeholder .body { color: var(--ink-faint); }
.quote.placeholder .body::before {
  content: "[ ";
  color: var(--ink-faint);
}
.quote.placeholder .body::after {
  content: " ]";
  color: var(--ink-faint);
}
@media (max-width: 1000px) {
  .quote { grid-column: 1 / -1; }
}

/* ── Contact / Footer ─────────────────────────────────── */

.contact {
  padding: clamp(56px, 9vw, 96px) 0 clamp(40px, 5vw, 56px);
  border-top: 1px solid var(--ink);
}
.contact-display {
  font-family: var(--serif);
  font-size: clamp(48px, 11vw, 160px);
  line-height: 0.92;
  letter-spacing: -0.025em;
  margin: 0 0 clamp(32px, 5vw, 48px);
}
.contact-display em { font-style: italic; }
.contact-display a {
  position: relative;
  text-decoration: none;
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-size: 100% 1px;
  background-position: 0 100%;
  transition: color 0.25s ease;
}
.contact-display a:hover { color: var(--accent); }

.contact-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gutter);
  border-top: 1px solid var(--rule);
  padding-top: 32px;
}
.contact-grid > div { grid-column: span 3; }
@media (max-width: 760px) {
  .contact-grid > div { grid-column: span 6; }
}
@media (max-width: 500px) {
  .contact-grid > div { grid-column: 1 / -1; }
}
.contact-grid .k {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 8px;
}
.contact-grid .v {
  font-family: var(--sans);
  font-size: 15px;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.contact-grid .v a:hover { color: var(--accent); }

.colophon {
  margin-top: 64px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
@media (max-width: 900px) {
  .contact-grid > div { grid-column: span 6; }
}

/* ── Reveal animation ─────────────────────────────────── */

.reveal {
  opacity: 1;
  transform: none;
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  .hero-marquee .track { animation: none; }
}

/* ── Image-slot styling override ──────────────────────── */

image-slot {
  --is-bg: var(--paper-deep);
  --is-fg: var(--ink-mute);
  --is-border: var(--rule);
}

/* ──────────────────────────────────────────────────────────
   Line-mask reveal (hero h1)
   ────────────────────────────────────────────────────────── */

.reveal-lines .line {
  display: block;
  overflow: hidden;
  padding-bottom: 0.05em;
  margin-bottom: -0.05em;
}
.reveal-lines .line .inner {
  display: inline-block;
}

/* ──────────────────────────────────────────────────────────
   Beyond the work — two bands, side-by-side on desktop
   ────────────────────────────────────────────────────────── */

.section--bleed { padding: 0; }

.beyond {
  display: grid;
  grid-template-columns: 1fr;
}
@media (min-width: 900px) {
  .beyond { grid-template-columns: 1fr 1fr; }
}

.beyond-band {
  width: 100%;
  padding: clamp(64px, 10vw, 140px) 0;
  position: relative;
  display: flex;
}
.beyond-band--dark {
  background: #14120F;
  color: #EDE8DE;
}
.beyond-band--light {
  background: var(--paper-soft);
  color: var(--ink);
}

.beyond-inner {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 clamp(24px, 5vw, 64px);
  display: flex;
  flex-direction: column;
  gap: clamp(16px, 2.4vw, 28px);
  width: 100%;
}
@media (min-width: 900px) {
  .beyond-band--dark .beyond-inner { margin-right: clamp(24px, 4vw, 64px); margin-left: auto; }
  .beyond-band--light .beyond-inner { margin-left: clamp(24px, 4vw, 64px); margin-right: auto; }
}

.beyond-eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.beyond-band--dark .beyond-eyebrow { color: rgba(237, 232, 222, 0.55); }
.beyond-eyebrow--accent { color: var(--accent); }
.beyond-band--dark .beyond-eyebrow--accent { color: var(--accent); }

.beyond-h {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(34px, 4.4vw, 64px);
  line-height: 1.04;
  letter-spacing: -0.022em;
  margin: 4px 0 8px;
  max-width: 14ch;
  text-wrap: balance;
}

.beyond-p {
  font-family: var(--sans);
  font-size: clamp(16px, 1.15vw, 18px);
  line-height: 1.55;
  max-width: 48ch;
  color: inherit;
  opacity: 0.78;
  text-wrap: pretty;
  margin: 0;
}

.beyond-cta {
  margin-top: clamp(16px, 2vw, 28px);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--sans);
  font-size: 16px;
  color: var(--accent);
  border-bottom: 1px solid var(--accent);
  padding-bottom: 4px;
  align-self: flex-start;
  width: max-content;
  transition: gap 0.25s ease;
}
.beyond-cta .arr { display: inline-block; transition: transform 0.25s ease; }
.beyond-cta:hover { gap: 14px; }
.beyond-cta:hover .arr { transform: translate(2px, -2px); }


/* ──────────────────────────────────────────────────────────
   Letter — envelope opening animation
   ────────────────────────────────────────────────────────── */

.letter-cta {
  margin-top: clamp(20px, 2.5vw, 32px);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #EDE8DE;
  background: transparent;
  border: 1px solid rgba(237, 232, 222, 0.32);
  padding: 11px 20px;
  border-radius: 999px;
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
}
.letter-cta:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(181, 70, 44, 0.08);
}
.letter-cta-glyph { display: inline-flex; transition: transform 0.25s ease; }
.letter-cta:hover .letter-cta-glyph { transform: translateY(-1px) rotate(-6deg); }

.letter-stage {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1600px;
  --env-w: min(440px, 86vw);
  --env-h: calc(var(--env-w) / 1.62);
  --slip-w-c: calc(var(--env-w) * 0.88);
  --slip-h-c: calc(var(--env-h) * 0.82);
  --slip-w-o: min(580px, 92vw);
  --slip-h-o: min(720px, 84vh);
}

.letter-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(20, 18, 15, 0.62);
  -webkit-backdrop-filter: blur(10px) saturate(140%);
  backdrop-filter: blur(10px) saturate(140%);
  animation: l-bd-in 0.42s ease forwards;
}
@keyframes l-bd-in { from { opacity: 0; } to { opacity: 1; } }
.letter-stage.stage-closing .letter-backdrop { animation: l-bd-out 0.35s ease forwards; }
@keyframes l-bd-out { to { opacity: 0; } }

.letter-close {
  position: absolute;
  top: 22px;
  right: 22px;
  width: 42px; height: 42px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid rgba(237, 232, 222, 0.28);
  color: #EDE8DE;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 5;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  opacity: 0;
  animation: l-bd-in 0.5s 0.5s ease forwards;
}
.letter-close:hover { background: rgba(237, 232, 222, 0.1); border-color: rgba(237, 232, 222, 0.55); }
.letter-stage.stage-closing .letter-close { animation: l-bd-out 0.25s ease forwards; }


.letter-scene {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-style: preserve-3d;
}

/* ─ Envelope ─ */
.envelope {
  position: absolute;
  top: 50%; left: 50%;
  width: var(--env-w);
  height: var(--env-h);
  transform: translate(-50%, -50%);
  transform-style: preserve-3d;
  animation: env-drop 0.7s cubic-bezier(.16,.84,.4,1) backwards;
  transition: opacity 0.55s ease 0.05s;
}
@keyframes env-drop {
  0% { transform: translate(-50%, -50%) translateY(-44vh) rotate(-6deg); opacity: 0; }
  55% { opacity: 1; }
  100% { transform: translate(-50%, -50%) translateY(0) rotate(0); opacity: 1; }
}
.letter-stage.stage-unfolding .envelope,
.letter-stage.stage-open .envelope { opacity: 0; pointer-events: none; }

.env-back {
  position: absolute; inset: 0;
  border-radius: 6px;
  background:
    linear-gradient(160deg, #D8C8A6 0%, #C9B68C 55%, #BBA478 100%);
  box-shadow:
    0 30px 60px -22px rgba(20, 16, 8, 0.55),
    0 8px 18px -10px rgba(20, 16, 8, 0.35),
    inset 0 0 0 1px rgba(120, 90, 40, 0.22);
  z-index: 1;
}
.env-back::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: 6px;
  background:
    linear-gradient(115deg, transparent 49.6%, rgba(120,90,40,0.16) 49.8%, rgba(120,90,40,0.16) 50.2%, transparent 50.4%),
    linear-gradient(65deg,  transparent 49.6%, rgba(120,90,40,0.16) 49.8%, rgba(120,90,40,0.16) 50.2%, transparent 50.4%);
  opacity: 0.55;
  pointer-events: none;
}

.env-front {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 60%;
  background:
    linear-gradient(178deg, #BBA478 0%, #A8915F 100%);
  border-radius: 0 0 6px 6px;
  z-index: 3;
  box-shadow:
    inset 0 8px 14px -8px rgba(50, 32, 8, 0.4),
    0 -1px 0 rgba(120, 90, 40, 0.3);
}
.env-front::before {
  /* upper V-edge of the front pocket */
  content: "";
  position: absolute;
  left: 0; right: 0; top: -1px;
  height: 1px;
  background: rgba(80, 56, 20, 0.4);
}

.env-flap {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 62%;
  background:
    linear-gradient(168deg, #D8C8A6 0%, #C2AC80 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transform: rotateX(0deg);
  z-index: 4;
  filter: drop-shadow(0 3px 4px rgba(80, 56, 20, 0.22));
  transition: transform 0.95s cubic-bezier(.7,.04,.3,1), z-index 0s 0.95s;
  backface-visibility: hidden;
}
.letter-stage.stage-breaking .env-flap { transform: rotateX(-6deg); transition-duration: 0.18s; }
.letter-stage.stage-flap .env-flap,
.letter-stage.stage-rising .env-flap,
.letter-stage.stage-unfolding .env-flap,
.letter-stage.stage-open .env-flap {
  transform: rotateX(-178deg);
}
.letter-stage.stage-flap .env-flap { z-index: 0; }
.letter-stage.stage-rising .env-flap,
.letter-stage.stage-unfolding .env-flap,
.letter-stage.stage-open .env-flap { z-index: 0; }

/* Wax seal at the flap tip */
.env-seal {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 46px; height: 46px;
  transform: translate(-50%, 50%) rotate(-4deg);
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #D85F3D 0%, #A53620 55%, #7A1F10 100%);
  box-shadow:
    0 4px 10px rgba(80, 18, 8, 0.45),
    inset 0 -4px 8px rgba(0,0,0,0.35),
    inset 0 3px 6px rgba(255,255,255,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: rgba(40, 10, 4, 0.55);
  text-shadow: 0 1px 0 rgba(255,255,255,0.18);
  transition: transform 0.18s ease;
}
.letter-stage.stage-breaking .env-seal {
  animation: seal-shake 0.22s ease;
}
@keyframes seal-shake {
  0%, 100% { transform: translate(-50%, 50%) rotate(-4deg); }
  25%      { transform: translate(-52%, 50%) rotate(-7deg); }
  50%      { transform: translate(-48%, 51%) rotate(-1deg); }
  75%      { transform: translate(-51%, 50%) rotate(-5deg); }
}


/* ─ Letter slip (the paper itself) ─ */
.letter-slip {
  position: absolute;
  top: 50%; left: 50%;
  width: var(--slip-w-c);
  height: var(--slip-h-c);
  transform: translate(-50%, -50%);
  background: #F8F2E4;
  border-radius: 2px;
  box-shadow:
    0 18px 40px -16px rgba(20, 16, 8, 0.35),
    0 4px 12px -6px rgba(20, 16, 8, 0.2),
    inset 0 0 0 1px rgba(120, 90, 40, 0.08);
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
  transition:
    width 0.75s cubic-bezier(.2,.7,.25,1),
    height 0.75s cubic-bezier(.2,.7,.25,1),
    transform 0.85s cubic-bezier(.2,.7,.25,1),
    opacity 0.4s ease,
    box-shadow 0.6s ease;
}
.letter-slip::before {
  /* faint horizontal fold crease line at 1/3 */
  content: "";
  position: absolute;
  left: 8%; right: 8%;
  top: 33.3%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(120,90,40,0.22), transparent);
  opacity: 1;
  transition: opacity 0.5s ease;
}
.letter-slip::after {
  /* second crease at 2/3 */
  content: "";
  position: absolute;
  left: 8%; right: 8%;
  top: 66.6%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(120,90,40,0.22), transparent);
  opacity: 1;
  transition: opacity 0.5s ease;
}

/* Stage: rising — slip translates up out of envelope, still folded-size */
.letter-stage.stage-rising .letter-slip {
  opacity: 1;
  transform: translate(-50%, calc(-50% - var(--env-h) * 0.62));
}

/* Stage: unfolding — slip grows to full size; envelope is fading out */
.letter-stage.stage-unfolding .letter-slip {
  opacity: 1;
  width: var(--slip-w-o);
  height: var(--slip-h-o);
  transform: translate(-50%, -50%);
  z-index: 6;
  pointer-events: auto;
  box-shadow:
    0 40px 90px -30px rgba(20, 16, 8, 0.55),
    0 10px 26px -10px rgba(20, 16, 8, 0.3),
    inset 0 0 0 1px rgba(120, 90, 40, 0.06);
}
.letter-stage.stage-unfolding .letter-slip::before,
.letter-stage.stage-unfolding .letter-slip::after,
.letter-stage.stage-open .letter-slip::before,
.letter-stage.stage-open .letter-slip::after {
  opacity: 0.25;
}

.letter-stage.stage-open .letter-slip {
  opacity: 1;
  width: var(--slip-w-o);
  height: var(--slip-h-o);
  transform: translate(-50%, -50%);
  z-index: 6;
  pointer-events: auto;
  box-shadow:
    0 40px 90px -30px rgba(20, 16, 8, 0.55),
    0 10px 26px -10px rgba(20, 16, 8, 0.3),
    inset 0 0 0 1px rgba(120, 90, 40, 0.06);
}

/* Closing: gentle scale-down + fade */

      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {

          for (const id of tombstones) delete merged[id];

      .then(() => { loaded = true; subs.forEach((fn) => fn()); });

  let saving = false;
  let saveDirty = false;

    if (saving) { saveDirty = true; return; }
    const w = window.omelette && window.omelette.writeFile;

    saving = true;

      const cap = Math.min(MAX_DIM, Math.max(1, Math.round(targetW * 2)) || MAX_DIM);

      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');

    ':host([data-reframe]){z-index:10}' +

    ':host([data-reframe]) .frame{box-shadow:0 0 0 2px #c96442}' +
    '.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
    '  justify-content:center;gap:6px;text-align:center;padding:12px;box-sizing:border-box;' +
    '  cursor:pointer;user-select:none}' +
    '.empty svg{opacity:.45}' +
    '.empty .cap{max-width:90%;font-weight:500;letter-spacing:.01em}' +
    '.empty .sub{font-size:11px}' +
    '.empty .sub u{text-underline-offset:2px;text-decoration-color:rgba(0,0,0,.25)}' +
    '.empty:hover .sub u{color:rgba(0,0,0,.75);text-decoration-color:currentColor}' +
    ':host([data-over]) .frame{outline:2px solid #c96442;outline-offset:-2px;' +
    '  background:rgba(201,100,66,.10)}' +
    '.ring{position:absolute;inset:0;pointer-events:none;border:1.5px dashed rgba(0,0,0,.25);' +
    '  transition:border-color .12s}' +
    ':host([data-over]) .ring{border-color:#c96442}' +
    ':host([data-filled]) .ring{display:none}' +
    '.ctl{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:8px;' +
    '  display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2;' +
    '  white-space:nowrap}' +
    ':host([data-filled][data-editable]:hover) .ctl,:host([data-reframe]) .ctl' +
    '  {opacity:1;pointer-events:auto}' +
    '.ctl button{appearance:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;' +
    '  background:rgba(0,0,0,.65);color:#fff;font:11px/1 system-ui,-apple-system,sans-serif;' +
    '  backdrop-filter:blur(6px)}' +
    '.ctl button:hover{background:rgba(0,0,0,.8)}' +
    '.err{position:absolute;left:8px;bottom:8px;right:8px;color:#b3261e;font-size:11px;' +
    '  background:rgba(255,255,255,.85);padding:4px 6px;border-radius:5px;pointer-events:none}';

  const icon =
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
    '<path d="m21 15-5-5L5 21"/></svg>';

  class ImageSlot extends HTMLElement {
    static get observedAttributes() {
      return ['shape', 'radius', 'mask', 'fit', 'position', 'placeholder', 'src', 'id'];
    }

    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML =
        '<style>' + stylesheet + '</style>' +
        '<div class="frame" part="frame">' +
        '  <img part="image" alt="" draggable="false" style="display:none">' +
        '  <div class="empty" part="empty">' + icon +
        '    <div class="cap"></div>' +
        '    <div class="sub">or <u>browse files</u></div></div>' +
        '  <div class="ring" part="ring"></div>' +
        '</div>' +
        '<div class="spill">' +
        '  <img class="ghost" alt="" draggable="false">' +
        '  <div class="handle" data-c="nw"></div><div class="handle" data-c="ne"></div>' +
        '  <div class="handle" data-c="sw"></div><div class="handle" data-c="se"></div>' +
        '</div>' +
        '<div class="ctl"><button data-act="replace" title="Replace image">Replace</button>' +
        '  <button data-act="clear" title="Remove image">Remove</button></div>' +
        '<input type="file" accept="' + ACCEPT.join(',') + '" hidden>';
      this._frame = root.querySelector('.frame');
      this._ring = root.querySelector('.ring');
      this._img = root.querySelector('.frame img');
      this._empty = root.querySelector('.empty');
      this._cap = root.querySelector('.cap');
      this._sub = root.querySelector('.sub');
      this._spill = root.querySelector('.spill');
      this._ghost = root.querySelector('.ghost');
      this._err = null;
      this._input = root.querySelector('input');
      this._depth = 0;
      this._gen = 0;
      this._view = { s: 1, x: 0, y: 0 };
      this._subFn = () => this._render();
      this._empty.addEventListener('click', () => this._input.click());
      root.addEventListener('click', (e) => {
        const act = e.target && e.target.getAttribute && e.target.getAttribute('data-act');
        if (act === 'replace') { this._exitReframe(true); this._input.click(); }
        if (act === 'clear') {
          this._exitReframe(false);
          this._gen++;
          this._local = null;
          if (this.id) setSlot(this.id, null); else this._render();
        }
      });
      this._input.addEventListener('change', () => {
        const f = this._input.files && this._input.files[0];
        if (f) this._ingest(f);
        this._input.value = '';
      });
      this._img.addEventListener('load', () => this._applyView());
      this.addEventListener('dblclick', (e) => {
        if (!this.hasAttribute('data-editable') || !this._reframes()) return;
        e.preventDefault();
        if (this.hasAttribute('data-reframe')) this._exitReframe(true);
        else this._enterReframe();
      });
      this._spill.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || !this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        e.stopPropagation();
        this._spill.setPointerCapture(e.pointerId);
        const rect = this.getBoundingClientRect();
        const fw = rect.width || 1, fh = rect.height || 1;
        const corner = e.target.getAttribute && e.target.getAttribute('data-c');
        let move;
        if (corner) {
          const iw = this._img.naturalWidth || 1, ih = this._img.naturalHeight || 1;
          const base = Math.max(fw / iw, fh / ih);
          const sx = corner.includes('e') ? 1 : -1;
          const sy = corner.includes('s') ? 1 : -1;
          const s0 = this._view.s;
          const w0 = iw * base * s0, h0 = ih * base * s0;
          const cx0 = (50 + this._view.x) / 100 * fw;
          const cy0 = (50 + this._view.y) / 100 * fh;
          const ox = cx0 - sx * w0 / 2, oy = cy0 - sy * h0 / 2;
          const diag0 = Math.hypot(w0, h0);
          const ux = sx * w0 / diag0, uy = sy * h0 / diag0;
          move = (ev) => {
            const proj = (ev.clientX - rect.left - ox) * ux +
                         (ev.clientY - rect.top - oy) * uy;
            const s = clampS(s0 * proj / diag0);
            const d = diag0 * s / s0;
            this._view.s = s;
            this._view.x = (ox + ux * d / 2) / fw * 100 - 50;
            this._view.y = (oy + uy * d / 2) / fh * 100 - 50;
            this._clampView();
            this._applyView();
          };
        } else {
          this.setAttribute('data-panning', '');
          const start = { px: e.clientX, py: e.clientY, x: this._view.x, y: this._view.y };
          move = (ev) => {
            this._view.x = start.x + (ev.clientX - start.px) / fw * 100;
            this._view.y = start.y + (ev.clientY - start.py) / fh * 100;
            this._clampView();
            this._applyView();
          };
        }

          try { this._spill.releasePointerCapture(e.pointerId); } catch {}
          this._spill.removeEventListener('pointermove', move);
          this._spill.removeEventListener('pointerup', up);
          this._spill.removeEventListener('pointercancel', up);
          this.removeAttribute('data-panning');
          this._dragUp = null;
        };
        this._dragUp = up;
        this._spill.addEventListener('pointermove', move);
        this._spill.addEventListener('pointerup', up);
        this._spill.addEventListener('pointercancel', up);
      });
      this.addEventListener('wheel', (e) => {
        if (!this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        const r = this.getBoundingClientRect();
        const cx = (e.clientX - r.left) / r.width * 100 - 50;
        const cy = (e.clientY - r.top) / r.height * 100 - 50;
        const prev = this._view.s;
        const next = clampS(prev * Math.pow(1.0015, -e.deltaY));
        if (next === prev) return;
        const k = next / prev;
        this._view.s = next;
        this._view.x = cx * (1 - k) + this._view.x * k;
        this._view.y = cy * (1 - k) + this._view.y * k;
        this._clampView();
        this._applyView();
      }, { passive: false });
    }

    connectedCallback() {
      if (!this.id && !ImageSlot._warned) {
        ImageSlot._warned = true;
        console.warn('<image-slot> without an id will not persist its dropped image.');
      }
      this.addEventListener('dragenter', this);
      this.addEventListener('dragover', this);
      this.addEventListener('dragleave', this);
      this.addEventListener('drop', this);
      subs.add(this._subFn);
      this._ro = new ResizeObserver(() => this._render());
      this._ro.observe(this);
      load();
      this._render();
    }

    disconnectedCallback() {
      subs.delete(this._subFn);
      this.removeEventListener('dragenter', this);
      this.removeEventListener('dragover', this);
      this.removeEventListener('dragleave', this);
      this.removeEventListener('drop', this);
      if (this._ro) { this._ro.disconnect(); this._ro = null; }
      this._exitReframe(false);
    }

    _enterReframe() {
      if (this.hasAttribute('data-reframe')) return;
      this.setAttribute('data-reframe', '');
      this._applyView();
      this._outside = (e) => {
        if (e.composedPath && e.composedPath().includes(this)) return;
        this._exitReframe(true);
      };
      this._esc = (e) => { if (e.key === 'Escape') this._exitReframe(true); };
      document.addEventListener('pointerdown', this._outside, true);
      document.addEventListener('keydown', this._esc, true);
    }

    _exitReframe(commit) {
      if (!this.hasAttribute('data-reframe')) return;
      if (this._dragUp) this._dragUp();
      this.removeAttribute('data-reframe');
      this.removeAttribute('data-panning');
      if (this._outside) document.removeEventListener('pointerdown', this._outside, true);
      if (this._esc) document.removeEventListener('keydown', this._esc, true);
      this._outside = this._esc = null;
      if (commit) this._commitView();
    }

    attributeChangedCallback() { if (this.shadowRoot) this._render(); }

    handleEvent(e) {
      if (e.type === 'dragenter' || e.type === 'dragover') {
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        if (e.type === 'dragenter') this._depth++;
        this.setAttribute('data-over', '');
      } else if (e.type === 'dragleave') {
        if (--this._depth <= 0) { this._depth = 0; this.removeAttribute('data-over'); }
      } else if (e.type === 'drop') {
        e.preventDefault();
        e.stopPropagation();
        this._depth = 0;
        this.removeAttribute('data-over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) this._ingest(f);
      }
    }

    async _ingest(file) {
      this._setError(null);
      if (!file || ACCEPT.indexOf(file.type) < 0) {
        this._setError('Drop a PNG, JPEG, WebP, or AVIF image.');
        return;
      }
      const gen = ++this._gen;
      try {
        const w = this.clientWidth || this.offsetWidth || MAX_DIM;
        const url = await toDataUrl(file, w);
        if (gen !== this._gen) return;
        this._exitReframe(false);
        const val = { u: url, s: 1, x: 0, y: 0 };
        setSlot(this.id || '', val);
        if (!this.id) { this._local = val; this._render(); }
      } catch (err) {
        if (gen !== this._gen) return;
        this._setError('Could not read that image.');
        console.warn('<image-slot> ingest failed:', err);
      }
    }

    _setError(msg) {
      if (this._err) { this._err.remove(); this._err = null; }
      if (!msg) return;
      const d = document.createElement('div');
      d.className = 'err'; d.textContent = msg;
      this.shadowRoot.appendChild(d);
      this._err = d;
      setTimeout(() => { if (this._err === d) { d.remove(); this._err = null; } }, 3000);
    }

    _reframes() {
      return this.hasAttribute('data-filled') &&
        (this.getAttribute('fit') || 'cover') === 'cover';
    }

    _geom() {
      const iw = this._img.naturalWidth, ih = this._img.naturalHeight;
      const fw = this.clientWidth, fh = this.clientHeight;
      if (!iw || !ih || !fw || !fh) return null;
      return { iw, ih, fw, fh, base: Math.max(fw / iw, fh / ih) };
    }

    _clampView() {
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

    _applyView() {
      const g = this._geom();
      const fit = this.getAttribute('fit') || 'cover';
      if (fit !== 'cover' || !g) {
        this._img.style.width = '100%';
        this._img.style.height = '100%';
        this._img.style.left = '50%';
        this._img.style.top = '50%';
        this._img.style.objectFit = fit;
        this._img.style.objectPosition = this.getAttribute('position') || '50% 50%';
        return;
      }
      const k = g.base * this._view.s;
      const w = (g.iw * k / g.fw * 100) + '%';
      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';
      this._img.style.width = w; this._img.style.height = h;
      this._img.style.left = l; this._img.style.top = t;
      this._img.style.objectFit = '';
      this._spill.style.width = w; this._spill.style.height = h;
      this._spill.style.left = l; this._spill.style.top = t;
    }

    _commitView() {
      const v = { s: this._view.s, x: this._view.x, y: this._view.y };
      if (this._userUrl) v.u = this._userUrl;
      if (this.id) setSlot(this.id, v);
      else { this._local = v; }
    }

    _render() {
      const mask = this.getAttribute('mask');
      const shape = (this.getAttribute('shape') || 'rounded').toLowerCase();
      let radius = '';
      if (shape === 'circle') radius = '50%';
      else if (shape === 'pill') radius = '9999px';
      else if (shape === 'rounded') {
        const n = parseFloat(this.getAttribute('radius'));
        radius = (Number.isFinite(n) ? n : 12) + 'px';
      }
      this._frame.style.borderRadius = mask ? '' : radius;
      this._frame.style.clipPath = mask || '';
      this._ring.style.borderRadius = mask ? '' : radius;
      this._ring.style.display = mask ? 'none' : '';

      const editable = !!(window.omelette && window.omelette.writeFile);
      this.toggleAttribute('data-editable', editable);
      this._sub.style.display = editable ? '' : 'none';

      let stored = this.id ? getSlot(this.id) : this._local;
      if (stored && stored.u && !/^data:image\//i.test(stored.u)) stored = null;
      const srcAttr = this.getAttribute('src') || '';
      this._userUrl = (stored && stored.u) || null;
      const url = this._userUrl || srcAttr;
      if (!this.hasAttribute('data-reframe')) {
        this._view = {
          s: stored && Number.isFinite(stored.s) ? clampS(stored.s) : 1,
          x: stored && Number.isFinite(stored.x) ? stored.x : 0,
          y: stored && Number.isFinite(stored.y) ? stored.y : 0,
        };
      }
      this._cap.textContent = this.getAttribute('placeholder') || 'Drop an image';
      if (url) {
        if (this._img.getAttribute('src') !== url) {
          this._img.src = url;
          this._ghost.src = url;
        }
        this._img.style.display = 'block';
        this._empty.style.display = 'none';
        this.setAttribute('data-filled', '');
        this._clampView();
        this._applyView();
      } else {
        this._img.style.display = 'none';
        this._img.removeAttribute('src');
        this._ghost.removeAttribute('src');
        this._empty.style.display = 'flex';
        this.removeAttribute('data-filled');
      }
    }
  }

  if (!customElements.get('image-slot')) {
    customElements.define('image-slot', ImageSlot);
  }
})();

  <script type="text/babel">
/* global React, ReactDOM */
const { useState, useEffect, useRef } = React;

// ── Reveal hook (visual only — content visible by default) ─
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add('in');
            io.unobserve(e.target);
          }
        });
      },
      { threshold: 0.1, rootMargin: '0px 0px -40px 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

// ── Top-level nav ───────────────────────────────────────
function TopNav() {

  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

}

// ── Reading progress ────────────────────────────────────
function Progress() {
  const barRef = useRef(null);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const pct = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100;
      if (barRef.current) barRef.current.style.width = `${pct}%`;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <div className="cs-progress">
      <div className="bar" ref={barRef} />
    </div>);

}

// ── TOC sidebar ─────────────────────────────────────────
const ALBUMS_TOC = [
  { id: 'section-context',  label: 'Context',    num: '01' },
  { id: 'section-problem',  label: 'Problem',    num: '02' },
  { id: 'section-role',     label: 'My Role',    num: '03' },
  { id: 'section-process',  label: 'My Process', num: '04' },
  { id: 'section-outcome',  label: 'Outcome',    num: '05' },
];

function TOC({ items }) {
  const [active, setActive] = useState(items[0]?.id || '');
  const [shown, setShown] = useState(false);
  const [hidden, setHidden] = useState(false);
  useEffect(() => {
    const els = items.map(item => document.getElementById(item.id)).filter(Boolean);
    if (!els.length) return;
    const update = () => {
      const threshold = window.innerHeight * 0.35;
      let current = els[0].id;
      for (const el of els) {
        if (el.getBoundingClientRect().top <= threshold) current = el.id;
      }
      setActive(current);
    };
    window.addEventListener('scroll', update, { passive: true });
    update();
    const showIo = new IntersectionObserver(
      ([e]) => setShown(e.isIntersecting || e.boundingClientRect.top < 0),
      { threshold: 0 }
    );
    showIo.observe(els[0]);
    const footer = document.querySelector('.cs-closing');
    const footerIo = footer ? new IntersectionObserver(
      ([e]) => setHidden(e.isIntersecting), { threshold: 0 }
    ) : null;
    if (footerIo) footerIo.observe(footer);
    return () => {
      window.removeEventListener('scroll', update);
      showIo.disconnect();
      footerIo && footerIo.disconnect();
    };
  }, []);
  const invisible = !shown || hidden;
  return (
    <nav className="cs-toc" style={{ opacity: invisible ? 0 : 1, pointerEvents: invisible ? 'none' : 'auto', transition: 'opacity 0.3s ease' }}>
      <span className="cs-toc-label">On this page</span>
      {items.map(item => (
        <a
          key={item.id}
          href={`#${item.id}`}
          className={active === item.id ? 'toc-active' : ''}
          onClick={e => {
            e.preventDefault();
            document.getElementById(item.id)?.scrollIntoView({ behavior: 'smooth' });
            setActive(item.id);
          }}
        >
          <span className="num">{item.num}</span>
          <span>{item.label}</span>
        </a>
      ))}
    </nav>);
}

// ── Natural-ratio drag-drop image slot ───────────────────
const _idb = new Promise((res, rej) => {
  const r = indexedDB.open('portfolio-imgs', 1);
  r.onupgradeneeded = e => e.target.result.createObjectStore('imgs');
  r.onsuccess = e => res(e.target.result);
  r.onerror = () => rej();
});
async function idbGet(key) {
  try { const db = await _idb; return await new Promise(r => { const q = db.transaction('imgs').objectStore('imgs').get(key); q.onsuccess = () => r(q.result||null); q.onerror = () => r(null); }); } catch { return null; }
}
async function idbSet(key, val) {
  try { const db = await _idb; await new Promise((res,rej) => { const tx = db.transaction('imgs','readwrite'); tx.objectStore('imgs').put(val,key); tx.oncomplete=res; tx.onerror=rej; }); } catch { try { localStorage.setItem(key,val); } catch {} }
}

function HeroImage({ storageKey, label }) {
  const [src, setSrc] = useState(null);
  const [over, setOver] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    idbGet(storageKey).then(val => {
      if (val) { setSrc(val); return; }
      try { const v = localStorage.getItem(storageKey); if (v) setSrc(v); } catch {}
    });
  }, [storageKey]);

  const ingest = async (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      const dataUrl = e.target.result;
      setSrc(dataUrl);
      await idbSet(storageKey, dataUrl);
    };
    reader.readAsDataURL(file);
  };

  return (
    <div
      className={`hero-img-slot${over ? ' hero-img-slot--over' : ''}`}
      onDragOver={e => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={e => { e.preventDefault(); setOver(false); ingest(e.dataTransfer?.files?.[0]); }}
      onClick={() => !src && inputRef.current?.click()}
    >
      {src
        ? <img src={src} alt="" />
        : <div className="hero-img-empty">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
            </svg>
            <span>{label}</span>
          </div>
      }
      <input ref={inputRef} type="file" accept="image/*" hidden onChange={e => ingest(e.target.files?.[0])} />
    </div>
  );
}
